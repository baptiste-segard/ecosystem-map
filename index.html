<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="An interactive map of the organisations helping business education flourish: who they are, where they are, what they work on and who they connect to.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* base reset (what the artifact wrapper used to provide) */
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
<title>Ecosystem Map Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height app shell — top bar / [filters | canvas | detail]. White ground, vivid colours of the earth (leaf, sky, sun, ocean, clay, moss), soft grey discs: optimistic, light, future-facing. Green is the accent. */
:root{
  /* paper surfaces, ink, hairlines */
  --paper:#FFFFFF; --paper-2:#FAF9F6; --paper-3:#F3F1EB; --ink:#141A17; --ink-2:#2A332E; --muted:#5B6660; --hairline:rgba(20,26,23,.08); --hairline-2:rgba(20,26,23,.16);
  --bg:var(--paper); --surface:var(--paper); --surface2:var(--paper-3); --fg:var(--ink); --line:var(--hairline); --line-strong:var(--hairline-2);
  --accent:#16A34A; --accent-soft:#E6F6EC; --accent-ink:#0F6B33; --dim:#A3ADA6;
  --brand-a:#16A34A; --brand-b:#2F80ED;
  --c1:#16A34A; --c2:#2F80ED; --c3:#F2B01E; --c4:#7C4DFF; --c5:#E2572B; --c6:#8BC34A;
  /* layered shadows replace card borders */
  --sh-1:0 1px 2px rgba(20,26,23,.05),0 0 0 1px rgba(20,26,23,.04); --sh-2:0 6px 20px -8px rgba(20,26,23,.14),0 0 0 1px rgba(20,26,23,.04); --sh-3:0 18px 44px -16px rgba(20,26,23,.20),0 0 0 1px rgba(20,26,23,.04);
  --r-card:16px; --r-panel:22px; --radius:16px;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Google Sans Flex","Google Sans","Figtree",system-ui,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs:15px; --fs-sm:13.5px; --fs-xs:12.5px; --fs-eyebrow:11.5px; --fs-h3:16px; --fs-h2:30px; --fs-chip:13.5px; --fs-btn:15px;
  --ease:cubic-bezier(.22,1,.36,1);
}
/* Deliberately single-theme: the map stays white in light and dark apps alike (design direction: white ground, vivid earth colours). */
:root, :root[data-theme="dark"]{ color-scheme:light }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.45 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(max-content,1fr);align-items:center;gap:14px;min-height:64px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:600 20px var(--font-display);font-variation-settings:"opsz" 48;margin:0;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand-btn{all:unset;cursor:pointer;font:inherit;color:inherit}
.brand-btn:hover{color:var(--accent)}
.brand-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
#gk .ga{stop-color:var(--brand-a)}
#gk .gb{stop-color:var(--brand-b)}
.brand h1 .mark{width:22px;height:22px;flex:none;margin-right:8px;vertical-align:-5px}
.mark{display:inline-block}
.brand .tag{font:500 var(--fs-eyebrow) var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:2px 6px}
.controls{display:flex;align-items:center;gap:8px;margin-left:auto;justify-self:end;min-width:0}
.view-seg{justify-self:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:2}
.search-toggle{display:none}
.seg.lang{padding:2px}
.seg.lang button{height:34px;padding:0 10px;font:600 12.5px var(--font-data);letter-spacing:.04em}
.search{position:relative}
/* "Your view" popover */
.pop-anchor{position:relative}
.popover{position:absolute;right:0;top:calc(100% + 8px);width:300px;max-width:calc(100vw - 24px);z-index:20;background:var(--paper);border:0;border-radius:var(--r-panel);box-shadow:var(--sh-3);padding:14px;display:grid;gap:14px}
.popover[hidden]{display:none}
.eyebrow{font:500 var(--fs-eyebrow) var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pop-summary{font-size:14.5px;line-height:1.4;margin-bottom:10px}
.pop-summary .muted{color:var(--muted)}
.pop-actions{display:flex;flex-wrap:wrap;gap:6px}
.pop-actions .btn{padding:8px 14px;font-size:14px}
.pop-actions .btn.ghost{border-color:transparent;color:var(--muted)}
.btn.toggle-filters[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
/* detail: description clamp */
.desc.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.readmore{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:var(--fs-sm);margin:-6px 0 4px}
/* legend: a pill by default, a card when opened */
.legend-pill{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px 8px 11px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.legend-pill .dots{display:inline-flex;gap:2px}
.legend-pill .dots i{width:7px;height:7px;border-radius:50%}
.legend[hidden],.legend-pill[hidden]{display:none}
.legend .lclose{float:right;background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;margin:-2px -4px 0 8px}
.hint select{font:inherit;font-weight:600;color:var(--fg);border:0;background:var(--surface2);border-radius:999px;padding:3px 8px;cursor:pointer}
.hint .crumb.zero{border-color:var(--c5);color:var(--fg)}
.search input{width:250px;max-width:50vw;height:40px;font-size:var(--fs-btn);padding:0 12px 0 36px;border:1px solid transparent;transition:background .2s,box-shadow .2s;border-radius:8px;background:var(--bg)}
.search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{border-radius:999px;background:var(--paper-3);border-color:transparent}
.search input:focus{background:var(--paper);box-shadow:var(--sh-2);outline:0}
.seg{display:inline-flex;position:relative;background:var(--paper-3);border-radius:999px;padding:3px;gap:2px}
.seg button{position:relative;z-index:1;background:transparent;border:0;height:38px;padding:0 16px;font-size:var(--fs-btn);cursor:pointer;color:var(--muted);border-radius:999px;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:600}
.seg .ind{position:absolute;top:3px;left:3px;height:38px;width:0;border-radius:999px;background:var(--paper);box-shadow:var(--sh-1);z-index:0;pointer-events:none}
.seg:not(.has-ind) button[aria-pressed="true"]{background:var(--paper);box-shadow:var(--sh-1)}
.seg-label{font-size:12px;color:var(--muted);margin-right:2px}
.btn{background:var(--paper);border:1px solid var(--hairline-2);border-radius:999px;padding:10px 18px;font-size:var(--fs-btn);cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s}
.btn:hover{box-shadow:var(--sh-1);transform:translateY(-1px)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

/* the page never scrolls as a whole: the map is pinned in its cell, only the two side panels scroll internally */
html{overflow:hidden}
main{flex:1;display:grid;grid-template-columns:auto minmax(0,62fr) minmax(360px,38fr);grid-template-rows:minmax(0,1fr);min-height:0;height:100%;position:relative;overflow:hidden}
aside{background:var(--surface);min-width:0;min-height:0;height:100%;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
aside.filters{border-right:1px solid var(--line);padding:12px 14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.sheet-close{display:none}
aside.detail{border-left:1px solid var(--line);padding:20px 24px 32px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.detail .desc{font-size:var(--fs);max-width:70ch}
.detail .meta{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.detail .reslist{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.detail .rel{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.detail .ev{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (max-width:1400px){ .detail .reslist,.detail .rel,.detail .ev{grid-template-columns:1fr} }
/* ---- typographic hierarchy (right panel, companion blocks, panorama) ----
   L1 .panel-title + .lede · L2 .sec>h3 · L3 cards (.card-base) · chips .tag/.chip small · body 15/1.55 */
.detail h2,.panel-title{font:600 30px/1.1 var(--font-display);font-variation-settings:"opsz" 144;letter-spacing:-.018em;color:var(--fg);margin:0 0 8px;text-wrap:balance}
.lede,.ident{font:400 17px/1.5 var(--font-ui);color:var(--muted);margin:0 0 14px;max-width:60ch}
.detail p,.detail .desc,.bub,.pan-sec .cap,.pan-head .cap{font-size:15px;line-height:1.55}
.detail .desc,.detail p.help,.gate .help{max-width:62ch}
.help{font-size:13.5px;line-height:1.5}
.num{font-family:var(--font-data);font-weight:600;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.stat{min-width:92px;background:var(--paper-2);box-shadow:var(--sh-1);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.stat b{font:600 22px/1 var(--font-data);color:var(--fg)}
.stat span{font:500 11px var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.more-li{list-style:none}
.more-li button{width:100%;background:none;border:1px dashed var(--line-strong);border-radius:12px;padding:9px;cursor:pointer;color:var(--accent);font:600 13.5px var(--font-ui)}
/* detail: document structure */
.detail a{color:var(--accent);text-decoration:none}
.detail a:hover{text-decoration:underline}
.dhead{display:flex;gap:16px;align-items:flex-start;margin-top:2px}
.dhead>div{min-width:0;flex:1}
.dhead h2{margin:0 0 4px}
.ident{font-size:14px;color:var(--muted);line-height:1.5}
.ident .loc{background:none;border:0;padding:0;color:var(--fg);cursor:pointer;font:inherit;border-bottom:1px dotted var(--line-strong)}
.ident .loc:hover{color:var(--accent);border-color:var(--accent)}
.fn{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--surface2);color:var(--muted);font:600 9.5px var(--font-data);vertical-align:middle;cursor:help;margin-left:2px}
.dactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper)!important;transition:transform .18s var(--ease),box-shadow .18s var(--ease);border-radius:999px;padding:10px 18px;font-weight:600;font-size:var(--fs-btn)}
.linkbtn:hover{text-decoration:none!important;transform:translateY(-1px);box-shadow:var(--sh-2)}
.sec{border-top:1px solid var(--line);margin-top:28px;padding-top:12px}
.sec>h3,.sec>summary h3,.pan-sec h3{font:600 15px/1.3 var(--font-display);font-variation-settings:"opsz" 24;letter-spacing:.01em;text-transform:none;margin:0 0 10px;display:flex;gap:8px;align-items:baseline;color:var(--ink-2)}
.sec h3 .n{font:500 12px var(--font-data);color:var(--muted);letter-spacing:0}
.sec .help{margin-top:-4px}
.sec .help{font-size:var(--fs-sm);color:var(--muted);margin:0 0 12px}
.sec .help:last-child{margin-bottom:0}
details.sec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .chev{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;transition:transform .15s;margin-left:auto}
details.sec[open] summary .chev{transform:rotate(180deg)}
details.sec .help{margin-top:4px}
.focus{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;margin:0}
.focus dt{font:500 var(--fs-eyebrow) var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:5px}
.focus dd{margin:0;min-width:0}
.focus dd .plain{font-size:15px;color:var(--fg);line-height:1.55}
.detail .focus .chip,.detail .rview .focus .chip{font-size:12px;padding:4px 10px;min-height:0;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
/* resource cards */
.rescard{border:0;border-left:3px solid var(--accent);border-radius:var(--r-card);padding:14px 16px;background:var(--paper);box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.rescard:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.rescard .rt{display:flex;gap:6px;align-items:center;font:500 var(--fs-eyebrow) var(--font-data);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rescard .ri{color:var(--accent);font-size:13px}
.rescard h4.rtitle{font:600 16px/1.3 var(--font-ui);margin:6px 0 6px;cursor:pointer;color:var(--fg)}
.rescard h4.rtitle:hover{color:var(--accent)}
.rescard .rsum{margin:0 0 6px;font-size:14px;max-width:62ch;color:var(--fg);line-height:1.45}
.rescard .rsum.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rescard .more-sum{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:13.5px;margin-bottom:6px}
.rwho{font-size:13.5px;line-height:2;color:var(--fg);margin-top:6px}
.rwho .verb{color:var(--muted)}
.rwho .sep{color:var(--muted);margin:0 6px}
.rwho .chip{font-size:12px;padding:2px 9px 2px 3px;min-height:0;vertical-align:middle;gap:6px;line-height:1.3;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.rwho .chip .lg{width:20px;height:20px;border-radius:4px;padding:1px}
.rwho .ext{color:var(--fg)}
.rwho .plusn{font:500 12px var(--font-data);color:var(--muted);margin-left:4px}
.rescard .rlink{display:inline-block;margin-top:10px;font-size:var(--fs-sm);font-weight:600}
/* results cards */
.results h2{margin:4px 0 4px}
.results h2 .n{font:500 14px var(--font-data);color:var(--muted)}
.results .crit{margin-bottom:14px}
.ocards,.reslist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ocard button{width:100%;min-width:0;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:0;border-radius:var(--r-card);padding:14px 16px;cursor:pointer;color:var(--fg);box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.ocard button:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.ocard .lg{width:36px;height:36px;border-radius:9px}
.ocard .ot{min-width:0;flex:1;display:grid;gap:2px}
.ocard .nm{font:600 16px/1.3 var(--font-ui)}
.ocard .sub{color:var(--muted);font-size:13px}
.ocard .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ocard .tag,.tag{font:500 12px/1.3 var(--font-ui);background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-radius:999px;padding:3px 9px;color:var(--fg)}
.kbadge{flex:none;font:500 11.5px var(--font-data);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 9px;white-space:nowrap}
.empty-state{text-align:center;padding:24px 12px;border:1px dashed var(--line-strong);border-radius:14px;color:var(--muted)}
.empty-state .big-n{font:600 44px/1 var(--font-display);color:var(--line-strong);margin-bottom:8px}
.empty-state .pop-actions{justify-content:center;margin-top:10px}
/* Panorama */
.panorama{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;background:var(--bg);padding:64px 24px 40px;z-index:2}
.panorama[hidden]{display:none}
body.panmode svg.map,body.panmode .legend,body.panmode .legend-pill,body.panmode .zoomctl{display:none}
.pan-inner{max-width:1120px;margin:0 auto;display:grid;gap:22px}
.pan-head h2{font:600 clamp(26px,3vw,36px)/1.08 var(--font-display);font-variation-settings:"opsz" 144;margin:2px 0 8px;letter-spacing:-.02em}
.pan-sec{border:0;box-shadow:var(--sh-1);border-radius:var(--r-panel);padding:18px 20px;background:var(--paper);min-width:0}
.pan-sec{padding-top:14px}
.pan-sec .cap,.pan-head .cap{color:var(--muted);font-size:var(--fs-sm);margin:0 0 12px;max-width:80ch}
.cap.small{font-size:12.5px;margin-top:10px;margin-bottom:0}
.pan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pan-grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.sankey{width:100%;height:auto;display:block}
.sankey .lk path{fill:none;stroke:var(--accent);stroke-opacity:.13;mix-blend-mode:multiply}
.sankey .lk path:hover{stroke-opacity:.45}
.sankey .node{cursor:pointer}
.sankey .node text{font:500 12.5px var(--font-ui);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.sankey .node text .n{font:500 11px var(--font-data);fill:var(--muted)}
.sankey .node:hover rect,.sankey .node:focus rect{stroke:var(--fg);stroke-width:1.5}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 32px;gap:8px;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.bar .bl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:4px}
.bar .bn{font:500 12px var(--font-data);color:var(--muted);text-align:right}
.bar:hover .bl{color:var(--accent)}
.timeline{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;border-bottom:1px solid var(--line-strong);padding-bottom:4px;margin-bottom:8px}
.tm .tdots{min-height:44px;display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.tdot{color:var(--accent);font-size:14px;line-height:1}
.tk{text-align:center;font:500 10.5px var(--font-data);color:var(--muted);text-transform:uppercase;border-left:1px solid var(--line);padding-top:4px}
.tk .ty{font-size:9.5px}
.tlist{list-style:none;margin:0;padding:0;font-size:12.5px;display:grid;gap:3px}
.tlist .mono{font:500 11px var(--font-data);color:var(--muted);margin-right:6px}
.matrix{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed;font-size:12.5px}
.matrix th{font:500 10.5px var(--font-data);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:2px 4px;vertical-align:bottom}
.matrix thead th span{display:block;white-space:normal;line-height:1.2;font-size:9.5px;overflow-wrap:anywhere}
.matrix td{text-align:center;padding:10px 4px;border-radius:6px;font:500 13px var(--font-data);color:var(--fg)}
.matrix td.diag{background:var(--surface2);color:var(--muted)}
.matrix td.thin{outline:1.5px dashed var(--c5);outline-offset:-2px;color:var(--c5)}
.matrix td.cell{cursor:pointer}
.matrix td.cell:hover,.matrix td.cell:focus-visible{box-shadow:0 0 0 2px var(--accent);outline-offset:-2px}
.pan-sec .lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit}
.pan-sec .lnk:hover{text-decoration:underline}
.jx-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.jx-cols .eyebrow{margin-bottom:8px}
.ideas{margin:0;padding-left:20px;display:grid;gap:8px;font-size:var(--fs)}
.junction .desc{max-width:62ch}
@media (max-width:980px){ .jx-cols{grid-template-columns:1fr} }
.bridges{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:b}

}

ity needs in over 45 chapters around the globe. They collaborate with a wide network of alumni, advisors, faculties, and partners, and are supported by an international management team based in Switzerland. oikos builds and empowers a global community to solve the challenges of...","city":"St. Gallen","country":"Switzerland","lat":47.42,"lng":9.37,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recI6k7pUK6nyBROP","name":"Australian Business Deans Council","archetype":"Research / think tank / knowledge platform","arena":"Business education","levers":["Research / thought leadership"],"themes":["Student leadership / youth agency","Research transformation"],"participants":["Students / young professionals"],"website":"https://abdc.edu.au/","desc":"The ABDC is the collective voice of Australian university business schools, which educate 16% of all domestic students ­and 39% of the nation’s international students. Our 38 members teach and research the areas vital to the success of the businesses that underpin the economy. The ABDC’s aim is to make business schools even better. As their peak body, ABDC’s role is to ensure that those with political, social, cultural and economic influence appreciate and support how business education contributes to Australia’s future.","city":"Melbourne","country":"Australia","lat":-37.81,"lng":144.96,"geo_conf":"M","scope":"National","region":"Asia-Pacific","logo":"airtable"},{"id":"recI8RmU8M1y2jrUg","name":"Tällberg Foundation","archetype":"Foundation / funder / donor collaborative","arena":"Cross-sector / systems change","levers":["Funding / enabling capital"],"themes":["Ethics / values / humanistic leadership","Sustainability / climate","Governance / institutional change"],"participants":["Funders / philanthropies"],"website":"https://tallbergfoundation.org/","desc":"The Tällberg Foundation, launched in 1981, exists to explore the issues that are challenging —and changing— our societies. Today, those challenges are profound: the world that we have known since the mid 20th century, which produced unprecedented peace as well as human advance, is changing at a pace and in directions that threaten to evolve towards Orwellian dystopia. But forces for “good” still exist and need to be renewed, made more muscular and more effective. The Foundation aspires to be part of that process. Tällberg’s work program focuses on understanding how to re-inject ethics into leadership; re-establish the legitimacy of governance; and manage, instead of being managed by, disruptive technologies, climate change, mass migration and other phenomena. We aim to contribute to the new thinking —and new acting— required by this moment in history.","city":"Stockholm","country":"Sweden","lat":59.33,"lng":18.07,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recIuQ3mKhAqzn2Ao","name":"United Nations","archetype":"Public / multilateral / UN body","arena":"Public policy / multilateral","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Policymakers / multilateral actors"],"website":"https://sdgs.un.org/","desc":"The United Nations is an international organization founded in 1945. It is currently made up of 193 Member States. The mission and work of the United Nations are guided by the purposes and principles contained in its founding Charter.","city":"New York, NY","country":"United States","lat":40.71,"lng":-74.01,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recJ3xQovTiUPaJ91","name":"Caux Round Table for Moral Capitalism","archetype":"Membership association / network","arena":"Corporate / business practice","levers":["Convening / peer exchange"],"themes":["Governance / institutional change"],"participants":["Corporate leaders / practitioners"],"website":"https://www.cauxroundtable.org/","desc":"The Caux Round Table for Moral Capitalism is an international network of experienced business leaders who work with business and political leaders to design the intellectual strategies, management tools, and practices to strengthen private enterprise and public governance to improve our global community. Seven core principles underlie the Caux Round Table for Moral Capitalism approach to responsible business practices. They are rooted in the recognition that neither the law nor market forces are sufficient to ensure positive and productive – in every sense of the term – conduct. Principle 1: Respect stakeholders beyond shareholders. A responsible business has responsibilities beyond its investors and managers. Principle 2: Contribute to economic and social development. Principle 3: Build trust by going beyond the letter of the law. Principle 4: Respect rules and conventions. Principle 5: Support responsible globalization. Principle 6: Respect the environment. Principle 7: Avoid illicit activities.","city":"Saint Paul, MN","country":"United States","lat":44.95,"lng":-93.09,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recJknyt7oxngQ1GY","name":"SDG Accord","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Ethics / values / humanistic leadership"],"participants":["Faculty / researchers"],"website":"https://www.sdgaccord.org/","desc":"To inspire, celebrate and advance the critical role that education has in delivering the Sustainable Development Goals (SDGs) and the value it brings to governments, business and wider society. Learning institutions commit to one another to do more to deliver the goals, to annually report on each signatory’s progress, and to do so in ways which share the learning with each other both nationally and internationally.","city":"Cheltenham","country":"United Kingdom","lat":51.9,"lng":-2.07,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recJzgDZweQizbfK7","name":"Drucker Forum","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Research / thought leadership","Convening / peer exchange"],"themes":["Research transformation"],"participants":["Faculty / researchers"],"website":"https://www.druckerforum.org/","desc":"The Drucker Forum is a global hub for thought leadership, management research and supporting individual / institutional members and partners united by a keen interest in Peter Drucker’s fundamental ideas and concepts. It is a network for supporting academic members to disseminate Peter Drucker’s thinking to a future generation of leaders and managers and offers a platform for a dialogue between all stakeholders to transfer Peter Drucker’s ideas and ideals to the requirements of our time and a meeting place for those who share concerns about the future of management.","city":"Vienna","country":"Austria","lat":48.21,"lng":16.37,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recK8v0VORyqoxm1W","name":"UN Environment Programme","archetype":"Public / multilateral / UN body","arena":"Public policy / multilateral","levers":["Convening / peer exchange"],"themes":["Sustainability / climate"],"participants":["Policymakers / multilateral actors"],"website":"https://www.unenvironment.org/regions/north-america","desc":"The United Nations Environment Programme (UNEP or UN Environment) is responsible for coordinating the UN's environmental activities and assisting developing countries in implementing environmentally sound policies and practices..","city":"Nairobi","country":"Kenya","lat":-1.29,"lng":36.82,"geo_conf":"H","scope":"Global","region":"Africa","logo":"airtable"},{"id":"recKbmcI8J85NC3y6","name":"SDG Transformation Forum","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://transformationsforum.net/","desc":"The vision of the Forum is a world transformed into a flourishing planet that is inclusive and just. The Forum’s mission is to urgently co-create and amplify transformational infrastructure and initiatives that systemically support the emergence of that future aligned with and going beyond the SDGs and Agenda 2030.","city":"Edinburgh","country":"United Kingdom","lat":55.95,"lng":-3.19,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recKejaKUvTczY39F","name":"Collective Leadership Institute","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.collectiveleadership.de/","desc":"The Collective Leadership Institute is a cutting-edge organization with deep expertise in bringing emerging paradigm leadership concepts to multi-stakeholder processes and projects in support of achieving the Sustainable Development Goals. The vision is to empower future-oriented people to lead collectively towards a sustainable future, believing in the principle of cooperation and collectively created solutions – across sectors, institutions, nations, and cultures.","city":"Potsdam","country":"Germany","lat":52.4,"lng":13.06,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recKhnqM0Ab6SL837","name":"International Futures Forum","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"http://internationalfuturesforum.com","desc":"IFF is developing a body of ideas and philosophy about how to make sense of today’s complex world. They share that thinking widely as a contribution to the global intellectual commons. They hold events to exchange ideas and experience, and members of IFF’s international clan stay in touch online and meet together as often as possible. They strive to embody their evolving insights in designed processes, tools, products, practices and ways of working that allow for their application in the context of specific challenges: IFF method.","city":"Aberdour","country":"United Kingdom","lat":56.05,"lng":-3.3,"geo_conf":"H","scope":"Global","region":"Europe","logo":"favicon"},{"id":"recL3s2VtWKxC2QaR","name":"Network of International Business and Economics Schools (NIBES)","archetype":"Membership association / network","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Student leadership / youth agency"],"participants":["Faculty / researchers","Students / young professionals"],"website":"https://www.nibes.org/","desc":"The Network of International Business and Economics Schools (NIBES) is one of the first world-wide active networks of universities with an orientation in business and economics. It was founded with the objective to promote internationalization of the member universities and to promote an understanding of global contexts within business education. Transnational and multilateral mobility of students and faculty as well as scholarly exchange between the partner institutions are the main goals of the cooperation. Over the past decades, the network succeeded in establishing many joint academic programs at Bachelor’s and Master’s level (partly as Double Degree or Joint Degree). The Network of International Business and Economic School (NIBES) was founded in May 1996 at Tours, France. NIBES currently consists of 21 member universities in 21 countries. List of member universities can be found here: https://www.nibes.org/index.php/members/","city":"Tours","country":"France","lat":47.39,"lng":0.69,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recM3LoLgG28lMkQy","name":"Asociación Española de Escuelas de Dirección de Empresa (AEEDE)","archetype":"Research / think tank / knowledge platform","arena":"Corporate / business practice","levers":["Research / thought leadership"],"themes":["Research transformation"],"participants":["Corporate leaders / practitioners"],"website":"https://aeede.es/","desc":"AEEDE was founded to provide a corporate response to the quality and service demanded in the training of managers. It encourages research on business management and promotes training based on methodologies that develop skills and leadership expertise. It promotes principles for professionals to carry out most effectively their professional careers in the business market.","city":"Madrid","country":"Spain","lat":40.42,"lng":-3.7,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recMpaOlNlR8DI7bs","name":"Giving Voice to Values","archetype":"Research / think tank / knowledge platform","arena":"Business education","levers":["Curriculum / pedagogy","Research / thought leadership"],"themes":["Ethics / values / humanistic leadership","Research transformation"],"participants":["Deans / rectors / presidents","Corporate leaders / practitioners"],"website":"http://www.givingvoicetovaluesthebook.com/","desc":"Giving Voice To Values (GVV) is an innovative curriculum and approach to values-driven leadership education. Developed with the Aspen Institute and Yale School of Management as founding partners and Aspen Institute as incubator in 2005–2009, the program is now based at and funded by Babson College. Dr. Mary C. Gentile is creator and director of the GVV program. Drawing on both the actual experience of business practitioners as well as cutting edge social science and management research, GVV fills a long-standing and critical gap in business education. GVV identifies the many ways that individuals can – and do – voice their values in the workplace and provides opportunities to build the skills and confidence necessary to do so.","city":"Wellesley, MA","country":"United States","lat":42.3,"lng":-71.29,"geo_conf":"H","scope":"Global","region":"North America","logo":null},{"id":"recMsPhIJCQSL81iX","name":"RRBM","archetype":"Rese NIVERSITY PRESIDENTS (IAUP) is an association of university chief executives from higher education institutions around the world. Membership is limited to those individuals who serve as presidents, rectors or vice-chancellors at regionally accredited colleges or universities. IAUP had its foundational Triennial Conference in 1965 and has continued to strive for excellence in the following: To increase the exchange of experiences, levels of collaboration and networking between university leaders. To provide a well informed forum for university leaders throughout the world. To contribute to a worldwide vision of higher education. To strengthen the international mission of institutions throughout the world. To make every effort for the voice of educational leaders to be heard. To support sustainable development in a context of global competency. To promote peace and international understanding through education. IAUP is a NGO (Non Governmental Organization) holding the highest (ECOSOC) consultation rights at the United...","city":"New York, NY","country":"United States","lat":40.71,"lng":-74.01,"geo_conf":"M","scope":"Global","region":"North America","logo":"airtable"},{"id":"recNK1kqfBx5Iv4WB","name":"Chartered Association of Business Schools","archetype":"Membership association / network","arena":"Business education","levers":["Advocacy / agenda-shaping","Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Policymakers / multilateral actors"],"website":"https://charteredabs.org/","desc":"The Chartered Association of Business Schools is the voice of the UK’s Business Schools and sets the agenda for business and management education in the UK within an increasingly international environment. It develops influential policies and promotes, communicates and lobbies on these at local, regional, national and international levels as appropriate. The Chartered ABS (including its subsidiary companies and charities) exists to support its members and affiliates. The Association provides a central vehicle to help members promote their common interests in business and management education, respond efficiently to key policy issues, develop institutional capacity, and share best methods and practice.","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recPbQsiK9kPGHivo","name":"The Council on Business & Society","archetype":"Corporate coalition / business membership body","arena":"Business education","levers":["Advocacy / agenda-shaping"],"themes":["Student leadership / youth agency"],"participants":["Policymakers / multilateral actors","Faculty / researchers","Students / young professionals"],"website":"https://www.council-business-society.org/","desc":"Recognising the enormous role business can and must play in helping solve large-scale, global issues facing the world, leading business schools have formed a partnership – The Council on Business & Society – open to other schools of business and management and corporate knowledge partners. Through individual and collective effort, and the participation of faculty, students, experts and policy-makers, the aim is to strive to create and disseminate knowledge on those issues and educate future business leaders capable of and committed to solving them.","city":"Cergy (Paris)","country":"France","lat":49.04,"lng":2.08,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recPrsE4bSMFqkL6L","name":"Mission Possible Foundation","archetype":"Foundation / funder / donor collaborative","arena":"Cross-sector / systems change","levers":["Funding / enabling capital"],"themes":["Responsible management education"],"participants":["Funders / philanthropies"],"website":"https://www.missionpossible.foundation/","desc":"The Mission Possible Foundation is like Charlie in \"Charlie's Angels\". It is never really seen and stays discreetly in the background, with },{"id":"recRFfk8F6xihpXM8","name":"The Humanity Awareness Initiative","archetype":"Campaign / movement / civil-society initiative","arena":"Civil society / movement","levers":["Convening / peer exchange"],"themes":["Regeneration / wellbeing economy"],"participants":["Faculty / researchers"],"website":"https://www.humanityawarenessinitiative.org/","desc":"The Humanity Awareness Initiative (HAI) is a global education and training movement designed to accelerate the evolution of human consciousness and societal wellbeing.","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"L","scope":"Global","region":"Europe","logo":"favicon"},{"id":"recRPHAdMCOWhM9TU","name":"The Weaving Lab","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://weavinglab.org/","desc":"The Weaving Lab is a community of weavers learning together how to interconnect people, projects and places to form thriving systems. Weaving entails raising awareness of our interdependence with each other and the rest of nature; fostering purposeful and synergistic collaborations; as well as developing learning cultures for teams and communities. We see weaving as an essential process for systemic change.","city":"Lisbon","country":"Portugal","lat":38.72,"lng":-9.14,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recRVvscWnnJlU4zF","name":"Net Impact","archetype":"Student / youth network","arena":"Business education","levers":["Student activation"],"themes":["Sustainability / climate","Student leadership / youth agency"],"participants":["Students / young professionals"],"website":"https://www.netimpact.org/home","desc":"Net Impact is a nonprofit membership organization for students and professionals interested in using business skills in support of various social and environmental causes. It serves both a professional organization and one of the largest student organizations among MBAs in the world.","city":"Oakland, CA","country":"United States","lat":37.8,"lng":-122.27,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recRjluUid7Y43cCp","name":"ISCN","archetype":"Research / think tank / knowledge platform","arena":"Higher education broadly","levers":["Curriculum / pedagogy","Research / thought leadership"],"themes":["Sustainability / climate","Assessment / measurement / ratings","Research transformation"],"participants":["Faculty / researchers"],"website":"https://international-sustainable-campus-network.org/","desc":"The mission of the ISCN is to provide an international forum to support higher education institutions in the exchange of information, ideas, and best practices for achieving sustainable campus operations and integrating sustainability in research and teaching.","city":"Zurich","country":"Switzerland","lat":47.38,"lng":8.54,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recRoz73d5YX8Sohn","name":"International Humanistic Management Association","archetype":"Membership association / network","arena":"Public policy / multilateral","levers":["Research / thought leadership","Convening / peer exchange","Curriculum / pedagogy"],"themes":["Ethics / values / humanistic leadership","Research transformation"],"participants":["Policymakers / multilateral actors","Faculty / researchers","Corporate leaders / practitioners"],"website":"https://humanisticmanagement.international/","desc":"Our Mission Our mission is to support the development and professionalization of humanistic management research, practice, pedagogy and policy. To do so we bring together global leaders from academia, practice, policy, media, faith, civil society and the general public to explore, implement and support practices of humanistic management. Our Goal To act as a hub for researchers, practitioners and policymakers interested in the promotion and practice of Humanistic Management and Leadership consistent with the mission and values of Humanistic Management globally. Our Story More than decade ago many of us felt the need to gather like-minded humanistically inspired scholars, practitioners, policy makers and civil society leaders that wanted to change the world through better management. We were witnessing the many crises and set off to gather global thought and action leaders to innovate our thinking and practice of management. The International Humanistic Management Association is the global structure to build...","city":"New York, NY","country":"United States","lat":40.71,"lng":-74.01,"geo_conf":"M","scope":"Global","region":"North America","logo":"airtable"},{"id":"recS1I3TZVysdmm05","name":"Tellus Institute (Great Transition Initiative)","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Sustainability / climate","Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://greattransition.org/","desc":"The Great Transition Initiative is an online forum of ideas and an international network for the critical exploration of concepts, strategies, and visions for a transition to a future of enriched lives, human solidarity, and a resilient biosphere. By enhancing scholarly discourse and public awareness of possibilities arising from converging social, economic, and environmental crises, and by fostering a broad network of thinkers and doers, it aims to contribute to a new praxis for global transformation.","city":"Boston, MA","country":"United States","lat":42.36,"lng":-71.06,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recS8PJhDUTxjbsXr","name":"Ecoversities Alliance","archetype":"Other","arena":"Higher education broadly","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://ecoversities.org/","desc":"The Ecoversities Alliance is committed to radically re-imagining higher education to cultivate human and ecological flourishing. Ecoversities seek to transform the unsustainable and unjust economic, political and social systems/mindsets that dominate the planet. The Ecoversities Alliance is not a formal organization, and its the activities unfold through a process of trust and mutuality, a growing web of relationships that have been nurtured through our gatherings and beyond.","city":"Oakland, CA","country":"United States","lat":37.8,"lng":-122.27,"geo_conf":"L","scope":"Global","region":"North America","logo":"airtable"},{"id":"recSCI4VcPKU86g4M","name":"the Possibilists","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Student leadership / youth agency","Systems change / transformation","Social innovation / social impact"],"participants":["Students / young professionals"],"website":"https://thepossibilists.org/","desc":"Young people are behind some of the world’s most disruptive and inclusive social innovations and movements. They are creating much-needed in their communities. But: They struggle! They are often sacrificing their personal finances and well-being to dedicate their lives to impact and need support on many dimensions. The system often works against them! We believe it’s time to improve the conditions for ‘change-making’ and to tackle this challenge at the ecosystemic level! We can only do that collaboratively. Which is why in 2021 a group of global youth social innovation networks came together to create The Possibilists Alliance. The Possibilists is a global alliance of the world’s largest youth social innovation networks. We are united by our unwavering belief in the power and potential of youth. We envision a global support ecosystem that is aligned around a data-driven understanding of the needs of young changemakers and co-creates the best possible...","city":"Berlin","country":"Germany","lat":52.52,"lng":13.4,"geo_conf":"M","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recSMrlrI85Jfrnnd","name":"Forward Institute","archetype":"Consultancy / method / leadership-development platform","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Sustainability / climate"],"participants":["Faculty / researchers"],"website":"https://www.forward.institute/","desc":"The Forward Institute was set up in 2015 by a group of major organisations with a bold purpose: to make responsible leadership the only leadership. Humanity and our planet faces historic challenges. In the face of mounting populism, widening inequality, technological disruption and climate change, we must all ask ourselves how we can best use the resources we have – our energy, voice, influence, and imagination – to have an impact. Much depends on our collective leadership over the next decade. So we’re on a quest to help leaders and some of the world’s most influential organisations become more sustainable, equitable, and purposeful. We’re building a movement for responsible leadership. We are a mission-driven, non-profit organisation. We were founded by a group of senior leaders and span out of the Boston Consulting Group. Our work is guided by the lived experience of the senior leaders who advise us, as well...","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recSRGjNvUYXhEqnr","name":"Association of Business Schools Finland (ABS)","archetype":"Membership association / network","arena":"Business education","levers":["Advocacy / agenda-shaping","Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Policymakers / multilateral actors","Deans / rectors / presidents"],"website":"https://www.abs.fi/eng/homepage/","desc":"Association of Business Schools Finland (ABS) is an organization for all the university level business schools in Finland, promoting the interest of the business schools, participating in societal discussions and giving the input that only business schools can to the national debate. ABS also promotes the sharing of best practice amongst its members and is acting as a forum for discussion and policy making for the different business schools in Finland. ABS is a result of a strategy process of the business schools that was completed in 2010. In the final meeting, where the strategy was adopted, the rectors, deans and directors of the different business schools decided to set up an independent organization to follow through and implement mentioned strategy (in 2011).","city":"Helsinki","country":"Finland","lat":60.17,"lng":24.94,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recTF7Y8QczZXlWPa","name":"Business Roundtable","archetype":"Membership association / network","arena":"Public policy / multilateral","levers":["Advocacy / agenda-shaping","Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Policymakers / multilateral actors"],"website":"https://www.businessroundtable.org/","desc":"Business Roundtable is an association of chief executive officers of America’s leading companies working to promote a thriving U.S. economy and expanded opportunity for all Americans through sound public policy.","city":"Washington, DC","country":"United States","lat":38.9,"lng":-77.04,"geo_conf":"H","scope":"National","region":"North America","logo":"airtable"},{"id":"recTHF6bxP3N7RXLL","name":"Forum for the Future","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Sustainability / climate","Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://www.forumforthefuture.org/","desc":"Forum for the Future is a leading international sustainability non-p ectual and moral solidarity of humanity. In this spirit, UNESCO develops educational tools to help people live as global citizens free of hate and intolerance. UNESCO works so that each child and citizen has access to quality education. By promoting cultural heritage and the equal dignity of all cultures, UNESCO strengthens bonds among nations. UNESCO fosters scientific programmes and policies as platforms for development and cooperation. UNESCO stands up...","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recU6Eu1u4962oZQs","name":"Positive Impact Rating","archetype":"Other","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Assessment / measurement / ratings","Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://www.positiveimpactrating.org/","desc":"The Positive Impact Rating aims to foster collaboration, inspire deep change and remove the competition and pressure of a traditional rating. Our purpose is to measure how business schools contribute to solving societal challenges and act as a lever of change to the transformation of the business school landscape. The Positive Impact Rating is inspired by the 50+20 Vision.","city":"Lucerne","country":"Switzerland","lat":47.05,"lng":8.31,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recUNlpheHS4qzen2","name":"Zermatt Summit","archetype":"Corporate coalition / business membership body","arena":"Corporate / business practice","levers":["Convening / peer exchange"],"themes":["Ethics / values / humanistic leadership"],"participants":["Corporate leaders / practitioners"],"website":"https://www.zermattsummit.org","desc":"The Zermatt Summit is an annual forum of business leaders, thinkers and innovators that promotes the importance of human values and ethics in a globalized world. Zermatt Summit is not about finding a “silver bullet”– the revolu table for the societal role that universities play and how they allocate public funds. - Lobbying for the right conditions to further strengthen education...","city":"The Hague","country":"Netherlands","lat":52.07,"lng":4.3,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recXyEIDzoFLL1OVF","name":"Conférence des Grandes écoles","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.cge.asso.fr/commissions/ddrs/","desc":"La Conférence des grandes écoles comprend 285* membres dont 235 Grandes écoles (ingénieur, management, architecture, sciences politiques, création & design, journalisme, écoles militaires, écoles vétérinaires et de santé, etc.) toutes reconnues par l’État, délivrant un diplôme de grade master. Certaines d’entre elles délivrent en propre le doctorat et des diplômes nationaux de master. Elle compte également 9 entreprises membres et 41 organismes membres. La Conférence des grandes écoles est organisée en 10 commissions et 44 groupes de travail. L'admission à la CGE est soumise à des critères exigeants portant sur la structure, les modalités de recrutement, l’approche pédagogique, l’ouverture internationale, le lien avec l’entreprise, l’accompagnement des étudiants et la nature des diplômes.","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recY32iePzplx8PWq","name":"Association of MBAs (AMBA)","archetype":"Accreditation / standards / rating body","arena":"Business education","levers":["Standards / benchmarks / assessment","Accreditation / quality assurance"],"themes":["Student leadership / youth agency"],"participants":["Accrediting / QA professionals","Students / young professionals"],"website":"https://www.associationofmbas.com/","desc":"Established in 1967, AMBA is the international impartial authority on postgraduate business education. It accredits MBA, DBA, and MBM programs at over 300 business schools in more than 60 countries. As a respected organisation, ABMA is committed to raising the profile and quality standards of business education internationally, for the benefit of Business Schools, MBA students and graduates and alumni, employers, communities and society.","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recYKClG7L6202zUC","name":"The Centre for Global Inclusion","archetype":"Research / think tank / knowledge platform","arena":"Civil society / movement","levers":["Research / thought leadership"],"themes":["Inclusion / equity / justice","Research transformation"],"participants":["Faculty / researchers"],"website":"https://centreforglobalinclusion.org/","desc":"The Centre for Global Inclusion was formed in July 2017. Our activities are directed at serving as a resource for research and education for individuals and organizations in the quest to improve diversity and inclusion practices around the world. We distribute our free offerings to individuals, academia/education, businesses, governments, community organizations, and NGOs around the world. Our overarching goal is to make the world a better place for all.","city":"Chicago, IL","country":"United States","lat":41.88,"lng":-87.63,"geo_conf":"L","scope":"Global","region":"North America","logo":"airtable"},{"id":"recYy3Kp9L7DwCRuZ","name":"Regenerators Collective","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Ethics / values / humanistic leadership","Assessment / measurement / ratings","Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://www.regenerators.co/","desc":"The Regenerators is a collective of professionals coming together to aid the emergence of a new thriving paradigm built
