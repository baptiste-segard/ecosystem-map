able"},{"id":"recaGd7FwpodftVIC","name":"ICHEA","archetype":"Membership association / network","arena":"Higher education broadly","levers":["Convening / peer exchange"],"themes":["Student leadership / youth agency"],"participants":["Corporate leaders / practitioners","Students / young professionals"],"website":"http://www.ichea.org/","desc":"The ICHEA, International Council for Higher Education Accreditation is a non-profit organization whose main aim is the stimulation and facilitation of the internationalization of higher education around the world, and to meet the professional needs of individuals active in international education. ICHEA is a primary national voice for voluntary accreditation and quality assurance to the international education society and a primary national voice for voluntary accreditation to the general public, opinion leaders, students and families.ICHEA is sub-organization supported by UNESCO. The ICHEA is an association of international education professionals. It is a multi-sectoral organization made up of individual and corporate members. The ICHEA represents members from all education sectors (public and private) - university, vocational education, schools and English language - as well as from government and commercial organizations. ICHEA aims to work in close collaboration with governments and their instrumentalities, industry peak bodies, corporate and commercial interests.","city":"Washington, DC","country":"United States","lat":38.9,"lng":-77.04,"geo_conf":"L","scope":"Global","region":"North America","logo":"airtable"},{"id":"recbk4QQwUlLd27n5","name":"Cirses","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.cirses.fr/","desc":"CIRSES est une association \"métier\" qui a été créée en 2013 par des responsables DD&RS issus d’établissements de l’enseignement supérieur. Elle regroupe aujourd’hui plus de 130 membres créant ainsi un réseau national qui maille la quasi totalité de la France ! Le Collectif pour l’Intégration de la Responsabilité Sociétale et du développement durable dans l’Enseignement Supérieur (CIRSES) est une association professionnelle loi 1901, créée en septembre 2013 qui se fixe trois missions : - Accompagner les personnes en charge de la mission Développement Durable et de Responsabilité Sociétale (DD&RS) dans les établissements de l’enseignement supérieur, - Contribuer au rayonnement des démarches de développement durable et de responsabilité sociétale des établissements de l’enseignement supérieur, - Être la référence en matière de pratiques sur le développement durable et la responsabilité sociétale dans l’Enseignement Supérieur et la Recherche français. CIRSES est également identifié comme opérateur du Label DD&RS pour les établissements d’enseignement supérieur...","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recbrs5YHwS2jbhxT","name":"C40","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Sustainability / climate"],"participants":["Faculty / researchers"],"website":"c40.org","desc":"C40 is a network of the world’s megacities committed to addressing climate change. C40 supports cities to collaborate effectively, share knowledge and drive meaningful, measurable and sustainable action on climate change.","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"reccebCrbP25LCDv7","name":"Re_Generation","archetype":"Student / youth network","arena":"Business education","levers":["Student activation","Advocacy / agenda-shaping"],"themes":["Sustainability / climate","Biodiversity / planetary boundaries","Regeneration / wellbeing economy"],"participants":["Policymakers / multilateral actors","Students / young professionals"],"website":"https://www.re-generation.ca/","desc":"We’re a group of Canada’s most impact-focused students and young professionals — using our energy to open doors for the next generation of sustainability leaders. Re_imagine schools Developing action and capacity-building toolkits for student leaders across the country to influence change within their schools. Re_purpose careers Building career development tools for students and young professionals who want to contribute to a more sustainable and just society. Re_model companies Empowering young employees to create internal change while advocating for public policy changes that advance a more regenerative economy. After three years of existence under the name “Canadian Business Youth Council for Sustainable Development,” we changed our name to Re_Generation to become more inclusive to any youth (and not just business youth), and to play both on the idea that the future of sustainability is “regenerative”, and that we are the new generation of leaders. Re_Generation takes inspiration from a long list...","city":"Toronto","country":"Canada","lat":43.65,"lng":-79.38,"geo_conf":"M","scope":"National","region":"North America","logo":"airtable"},{"id":"reccy9KdpeDewrRGR","name":"World Economic Forum","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Governance / institutional change"],"participants":["Faculty / researchers"],"website":"https://www.weforum.org/","desc":"It was established in 1971 as a not-for-profit foundation and is headquartered in Geneva, Switzerland. It is independent, impartial and not tied to any special interests. The Forum strives in all its efforts to demonstrate entrepreneurship in the global public interest while upholding the highest standards of governance. Moral and intellectual integrity is at the heart of everything it does.","city":"Geneva","country":"Switzerland","lat":46.2,"lng":6.14,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recdQ7yNHo0zJecID","name":"The Whole Partnership","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers","Corporate leaders / practitioners"],"website":"https://www.wholepartnership.com/","desc":"The Whole Partnership™ is a purpose-led leadership and systemic coaching consultancy, which applies a systems lens to individual, organisational and social transformation. We have been drawn together by shared purpose and desire to bring the “whole self, whole systems” approach that we have been co-creating to clients. Their vision of creating purposeful, inspiring organisations where people love to work, started with – and continues to inform – their own. In addition to their commercial work with clients, they host an active community of advanced practitioners who co-pioneer applying our systemic and creative approach to the vocational projects that matter to them. Their story is profoundly connected to the development of Systemic Coaching and Constellations work in the UK, as well as to the evolution of other leading edge practices in dialogue and organisational development across the globe. They provide our training programmes in Systemic Coaching and Constellations in partnership with...","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"rece3cFpEDCuD2uN9","name":"Academy of International Business (AIB)","archetype":"Research / think tank / knowledge platform","arena":"Business education","levers":["Research / thought leadership","Advocacy / agenda-shaping"],"themes":["Assessment / measurement / ratings","Research transformation"],"participants":["Policymakers / multilateral actors"],"website":"https://www.aib.world/","desc":"AIB was founded in 1959 by a close-knit group of like-minded scholars looking to share the ideas and resources that would help define the emerging field of international business. Today, we’re a 501(c)(3) nonprofit dedicated to promoting impactful research, improving business education and practice, and collaborating with leaders in policy and interdisciplinary research.","city":"East Lansing, MI","country":"United States","lat":42.74,"lng":-84.48,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"receX10GT4aE41tCA","name":"Enactus","archetype":"Student / youth network","arena":"Business education","levers":["Student activation"],"themes":["Ethics / values / humanistic leadership","Assessment / measurement / ratings","Student leadership / youth agency"],"participants":["Corporate leaders / practitioners","Students / young professionals"],"website":"https://enactus.org/","desc":"Enactus is the largest experiential learning platform developing NextGen Leaders with a head for business and a heart for the world. Through Enactus 72,000 students are entrepreneurial, values-driven social innovators across 1,730 campuses in 36 countries, positively impacting the lives of 1.3 million people each year. Guided by educators and supported by business leaders, teams of students conduct needs assessments in their community, identify potential solutions to complex issues and implement community impact projects. This results in communities benefiting from collaboration and fresh innovation, plus students gain the valuable experience to advance their personal and professional lives.","city":"Springfield, MO","country":"United States","lat":37.21,"lng":-93.29,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recfclCWQDN1JMjBB","name":"Associazione Italiana per la Formazione Manageriale (ASFOR)","archetype":"Membership association / network","arena":"Higher education broadly","levers":["Convening / peer exchange"],"themes":["Assessment / measurement / ratings"],"participants":["Corporate leaders / practitioners"],"website":"https://www.asfor.it/en/","desc":"Established in 1971 as an Association for Corporate Management Training, ASFOR – (Associazione Italiana per la Formazione Manageriale) the Italian Association for Management Training aims to develop management culture in Italy and to qualify the Management Training offer by continuously adapting it to match the dynamics of demand. The only one of its kind in Italy, ASFOR is an association of individuals with legal status operating in the field of management training, both as offer structures and as users of training services (Schools of Management, Training Institutions, Companies and Corporate University Academies in the private and public sectors), or who in some way support its development (see list of Members).","city":"Milan","country":"Italy","lat":45.46,"lng":9.19,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recfhEVdZDk0QJ2fv","name":"EDAMBA (European Doctoral Programmes Association in Management and Business Administration)","archetype":"Accreditation / standards / rating body","arena":"Business education","levers":["Research / thought leadership","Standards / benchmarks / assessment","Accreditation / quality assurance"],"themes":["Ethics / values / humanistic leadership","Inclusion / equity / justice","Research transformation"],"participants":["Accrediting / QA professionals"],"website":"https://www.edamba.eu/","desc":"EDAMBA is the ‘European Doctoral Programmes Association in Management and Business Administration’. We aim to promote and facilitate cooperation among Doctoral Programmes in Management and Business Administration. Our members are Business Schools, Universities and Schools of Management with PhD programmes. Established in 1991, our mission is to develop common ideas, values, evaluation criteria, standards, and practices to assess and enhance the quality of doctoral education, through the exchange of experiences and cooperation in a global network. EDAMBA's purpose is to: - Provide a network to exchange information, - Promote research co-operation - Help to increase the quality of PhD programmes - Create an environment of excellence with a European perspective - Pursue diversity EDAMBA has 60 members from 30 countries. Our members are committed to creating and sharing initiatives and achieving excellence whilst appreciating and promoting collaboration, diversity and community building. Universities or business schools awarding one (or more) doctoral...","city":"Brussels","country":"Belgium","lat":50.85,"lng":4.35,"geo_conf":"H","scope":"Regional","region":"Europe","logo":"airtable"},{"id":"recfwgGo3xuLlOYno","name":"The Shift Project","archetype":"Research / think tank / knowledge platform","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://theshiftproject.org/lavenir-de-la-planete-dans-lenseignement-superieur/","desc":"The Shift Project (TSP) is a European-wide think tank. It aims to be a driving force, focused primarily on the means, for a transition to an economy free from dependence on fossil fuels (and therefore greenhouse gas emissions). At the interface between academia, business, civil society, and public and institutional authorities, our think tank aims to propose operational measures that address not the \"why\" question, but the \"how\" question. Les Shifters.","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recgPECGnslUqz1fv","name":"Times Higher Education","archetype":"Publisher / media / rankings platform","arena":"Higher education broadly","levers":["Public narrative / media / visibility"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.timeshighereducation.com/","desc":"THE is the data provider underpinning university excellence in every continent across the world. As the company behind the world’s most influential university ranking, and with almost five decades of experience as a source of analysis and insight on higher education, we have unparalleled expertise on the trends underpinning university performance globally. Our data and benchmarking tools are used by many of the world’s most prestigious universities to help them achieve their strategic goals.","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"H","scope":"Global","region":"Europe","logo":"favicon"},{"id":"rechVCBBLmccDUReX","name":"2 tonnes","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://www.2tonnes.org/","desc":"L'atelier 2tonnes propose aux participants d’explorer le futur en équipe et d’essayer de limiter le changement climatique en atteignant ces fameuses 2tonnes par an et par personne, d’ici à 2050. ​ Pour permettre une compréhension systémique des enjeux, l'atelier prend en compte les dimensions individuelles et collectives du sujet, sans oublier le rôle de l'influence, enjeu-clé de la transformation de la société. ​ Destiné autant aux plus novices qu'aux experts du sujet climatique, c'est aussi un vrai serious game, pensé pour rassembler et débattre ensemble, et que chacun puisse prendre du plaisir et exprimer son opinion.","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"rechuinW2bREsDLIS","name":"EQUAL Network","archetype":"Membership association / network","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.equal.network/","desc":"European in origin, now global in its membership, since its foundation in 1996, EQUAL is a unique platform and think tank where national, regional, and international business school associations and quality assurance agencies work together to exchange views and insights into trends, developments and best practices in business and management education. EQUAL’s impact is ultimately geared towards all business schools’ stakeholders.","city":"Brussels","country":"Belgium","lat":50.85,"lng":4.35,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"reciFdJvAsamgKS5B","name":"World Business Council for Sustainable Development","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.wbcsd.org","desc":"WBCSD is a global, CEO-led organization of over 200 leading businesses working together to accelerate the transition to a sustainable world. We help make our member companies more successful and sustainable by focusing on the maximum positive impact for shareholders, the environment and societies.","city":"Geneva","country":"Switzerland","lat":46.2,"lng":6.14,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"reciVBmDuZ5OBxu92","name":"UN Global Compact","archetype":"Public / multilateral / UN body","arena":"Public policy / multilateral","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Policymakers / multilateral actors"],"website":"https://www.unglobalcompact.org/","desc":"Business as a force for good. At the UN Global Compact, we aim to mobilize a global movement of sustainable companies and stakeholders to create the world we want. We provide a principle-based framework, best practices, resources and networking events that have revolutionized how companies do business responsibly and keep commitments to society. By catalyzing action, partnerships and collaboration, we make transforming the world possible – and achievable – for organizations large and small, anywhere around the globe.","city":"New York, NY","country":"United States","lat":40.71,"lng":-74.01,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recimfAy4GtSMzCbr","name":"La Fresque du Climat","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://fresqueduclimat.org/","desc":"Depuis fin 2018, l’association La Fresque du Climat œuvre pour embarquer tous les individus et toutes les organisations dans la transition, en permettant la diffusion rapide d’une compréhension partagée du défi que représente les changements climatiques. Nous réalisons cette mission d’éducation et de sensibilisation auprès de tous les publics, en France et dans plus de 50 pays. L’efficacité de cet outil pédagogique et sa licence d’utilisation ont facilité sa diffusion exponentielle, avec un doublement du nombre de personnes sensibilisées tous les 5 mois. L’association La Fresque du Climat a été créée fin 2018 par Cédric Ringenbach, son président fondateur, afin d’accélérer la diffusion de l’outil du même nom, de former des animateurs et des animatrices et de les faire monter en compétence. L’association a un fonctionnement décentralisé et participatif, initialement inspiré du parti pirate suédois, dont les grands principes sont la “do-ocratie”, le droit à l’erreur et la transparence. >...","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"reck0CqEavjNxPGWX","name":"The Natural Step","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Sustainability / climate","Systems change / transformation","Social innovation / social impact"],"participants":["Faculty / researchers"],"website":"https://thenaturalstep.org/","desc":"Since 1989, we have worked with thousands of corporations, municipalities, academic institutions and not-for-profit organizations that have proven that moving strategically toward sustainability leads to new opportunities, reduced costs and dramatically reduced ecological and social impacts. We are a leading partner for organisations ready to address humanities grand challenges to create a better future. We enable decision makers to manage complexity, define their future position and seize opportunities for short and long term success. Our programs are designed to facilitate change, build future-fit organisations, and collaborate towards breakthrough results for systems-level shifts. A shared understanding of our challenges and where we need to go, create the conditions for real transformation in society. With almost thirty years of experience helping organizations and individuals understand and make meaningful progress toward sustainability, The Natural Step has 12 offices with associates and strategic partners in 54 countries.","city":"Stockholm","country":"Sweden","lat":59.33,"lng":18.07,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"reckJlaY7o92d3gTA","name":"Responsible Futures","archetype":"Other","arena":"Cross-sector / systems change","levers":["Curriculum / pedagogy","Whole-institution transformation"],"themes":["Sustainability / climate","Student leadership / youth agency"],"participants":["Students / young professionals"],"website":"https://www.responsiblefutures.org.uk/","desc":"Responsible Futures is a supported change program and accreditation mark partnering students with their institutions to embed sustainability in all student learning, delivered by SOS-UK. Responsible Futures is a whole-institution approach to embedding holistic sustainability across the formal and informal curriculum in universities and colleges. Responsible Futures provides a framework and accompanying support to foster an enabling environment for staff and students to work together to embed sustainability into teaching and learning. A student-led audit provides the institution with valuable feedback and recommendations from students, and determines responsible futures accreditation. For 10 years, the program has been working to legitimise and mainstream education for sustainable development, ultimately helping to ensure students leave education with the knowledge, skills, and attributes needed to create a more just and sustainable society.","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recknWZIxKZKEpUke","name":"FIBAA (Foundation for International Business Administration Accreditation)","archetype":"Accreditation / standards / rating body","arena":"Higher education broadly","levers":["Standards / benchmarks / assessment","Accreditation / quality assurance"],"themes":["Assessment / measurement / ratings"],"participants":["Accrediting / QA professionals"],"website":"https://www.fibaa.org/en/","desc":"FIBAA is a European agency for quality assurance and qual specializing in the assessment and development of quality standards in higher education, particularly in business administration and related fields. Their work is consistently based on internationally recognised guidelines such as the 'European Standards and Guidelines for Quality Assurance', which are binding throughout Europe. As a dialogue partner for universities, we are actively committed to quality, transparency and comparability.","city":"Bonn","country":"Germany","lat":50.74,"lng":7.1,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recl2kiJvuA902v0v","name":"CEEMAN (Central and East European Management Development Association)","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Assessment / measurement / ratings"],"participants":["Faculty / researchers"],"website":"https://www.ceeman.org/","desc":"CEEMAN is an international management development association established in 1993 with the aim of accelerating the growth in quality of management development in central and eastern Europe. Now it is a global network of management development institutions interested in quality of education and innovations in this field, as well as in the broad area of subjects related to change, with 200 members from 50 countries in Europe, North America, Latin America, Africa, and Asia.","city":"Bled","country":"Slovenia","lat":46.37,"lng":14.11,"geo_conf":"H","scope":"Regional","region":"Europe","logo":"airtable"},{"id":"reclJX4d8JM6qAoLG","name":"GRLI Foundation","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange","Advocacy / agenda-shaping","Coalition-building / field-building"],"themes":["Assessment / measurement / ratings","Biodiversity / planetary boundaries","Systems change / transformation","Responsible management education"],"participants":["Corporate leaders / practitioners","Deans / rectors / presidents"],"website":"https://grli.org","desc":"For over twenty years, the Globally Responsible Leadership Initiative (GRLI) has stewarded questions of global responsibility inside the arenas shaping business and management education - across schools, organisations, and networks. It is not a traditional institution or membership as the name suggests but a catalytic initiative — small by design, global by orientation, focused on keeping a vital inquiry alive and generative. The work of the GRLI is held by an independent public benefit foundation registered in Belgium, formed via a 2003 agreement between EFMD and the UN Global Compact. It is held in strategic partnership with AACSB International, EFMD Global, and oikos International — a bridging position across the ecosystem’s principal quality, standards, and student-engagement bodies. The GRLI itself is small by design. Its core team comprises the office of the Executive Director supported by minimalist governance and finance administration. It deliberately caps its partnership at around 30 institutions to remain catalytic rather than institutional. Its 2030 sunset checkpoint ensures accountability and prevents institutional drift. Initiatives and actions are driven by the Partners and Associate institutions of the GRLI.","city":"Brussels","country":"Belgium","lat":50.85,"lng":4.35,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"reclaEXDobav9797x","name":"EFMD","archetype":"Accreditation / standards / rating body","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Corporate leaders / practitioners"],"website":"https://www.efmdglobal.org/","desc":"EFMD is a global, non-profit, membership driven organisation dedicated to management development. Recognised globally as an accreditation body for business schools, business school programmes, and corporate universities. With the support of our 900+ members across 91 countries, we act as a catalyst to promote and enhance excellence in management development globally. We are based in Brussels, Belgium, with offices in Geneva, Hong Kong, Miami and Prague.","city":"Brussels","country":"Belgium","lat":50.85,"lng":4.35,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recliaaFBHE7dfP6s","name":"Portals of Perception","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://portalsofperception.org/","desc":"Each human represents a portal of possibility, unto itself, and, as part of something greater. Each of us, by design, can become a living agency for the evolutionary process, as it arises, through our living expression. Their focus is to actively cultivate, and sculpt, the story of human development into the future. To create conversations at the frontier of discovery, while endeavoring to bring to life these natural processes of human development and evolution to discover, decode, and inspire inquiries into the unknown, and into becoming an intentional participant in the emergence of a wiser future.","city":"Seattle, WA","country":"United States","lat":47.61,"lng":-122.33,"geo_conf":"L","scope":"Global","region":"North America","logo":"airtable"},{"id":"recmUWp51sXwlB7dg","name":"FOME Alliance (Future of Management Education)","archetype":"Learning programme / course / toolkit platform","arena":"Business education","levers":["Curriculum / pedagogy"],"themes":["Ethics / values / humanistic leadership","Assessment / measurement / ratings"],"participants":["Faculty / researchers"],"website":"https://fomealliance.com/","desc":"Through our working groups and collaborations, we work to innovate and develop ideas in the following areas: Transforming pedagogies and digital assessment We strive to make online learning more flexible, social, and engaging. We understand the needs of online learners and design innovative approaches to teaching business education online. We test new-to-market technologies and critically evaluate their power to improve the learner experience. Leveraging the power of content sharing and virtual exchange The insendi platform enables partners to maximize the value of their online courses by allowing them to be repurposed across different business channels: executive education, online/blended learning courses, online degrees, and B2C. Members can copy or share content at the click of a button.","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"M","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recmcdLKzinX4Gr5b","name":"Solvable","archetype":"Membership association / network","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Sustainability / climate","Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://www.solvable.ca/","desc":"Solvable partners with organizations and collectives who have made bold commitments to move beyond iterative sustainability as usual into systemic transitions for a truly sustainable future. Through our immersive Learning Journeys and commons spaces such as New Works, we seek to create dialogic spaces of paradox and ambiguity with leaders that negate reductionism in favour of recognizing the complexity and abundance of a multicapital pluriverse. We use a broad toolkit of methodologies and a network of relations across fields to explore innovat ion at the edges of complex, adaptive living systems. Starting in mid-September, we will be guiding Accelerator Two with a diverse group of senior impact leaders from business, government, NGOs, and business schools learning with and from each other and an esteemed group of advisors. Over three months we will dive deeply into the societal impact competencies most needed to bring forth alternative futures. Besides having a passion...","city":"Vancouver, BC","country":"Canada","lat":49.28,"lng":-123.12,"geo_conf":"M","scope":"National","region":"North America","logo":"airtable"},{"id":"recn3funKZZCRgoB6","name":"European University Association","archetype":"Membership association / network","arena":"Higher education broadly","levers":["Research / thought leadership","Convening / peer exchange"],"themes":["Research transformation"],"participants":["Deans / rectors / presidents"],"website":"https://www.eua.eu/","desc":"The European University Association (EUA) represents more than 800 universities and national rectors’ conferences in 48 European countries. EUA plays a crucial role in the Bologna Process and in influencing EU policies on higher education, research and innovation. Through continuous interaction with a range of other European and international organisations, EUA ensures that the independent voice of European universities is heard.","city":"Brussels","country":"Belgium","lat":50.85,"lng":4.35,"geo_conf":"H","scope":"Regional","region":"Europe","logo":"airtable"},{"id":"recoL4ywrMe5T3GrD","name":"Sustainability Curriculum Consortium (SCC)","archetype":"University alliance / academic consortium","arena":"Higher education broadly","levers":["Curriculum / pedagogy","Advocacy / agenda-shaping","Public narrative / media / visibility"],"themes":["Sustainability / climate"],"participants":["Policymakers / multilateral actors","Faculty / researchers"],"website":"https://www.curriculumforsustainability.org/","desc":"The Sustainability Curriculum Consortium ™ (SCC) represents an opportunity to fill a gap within the sustainability movement in higher education. Essentially, the SCC senses that faculty professional development and curriculum development in this area have lagged behind other university initiatives in areas such as carbon/climate impact reduction, environmentally-conscious purchasing, and campus greening. Even among Environmental Science and Environmental Studies faculty, there are ambiguity and conflict about what sustainability means, the complexity it embraces, and what its pedagogy should encompass. When comparing the language and practice of sustainability in academia with those of our counterparts in policy and industry, the SCC perceive there has been a slow rift in the last decade, one that faculty and curriculum development can uniquely (and must immediately) address. We envision a consortium that builds our collective capacity as educators and change agents, along with the administrators and stakeholders who can support them, to improve the...","city":"Boston, MA","country":"United States","lat":42.36,"lng":-71.06,"geo_conf":"L","scope":"National","region":"North America","logo":"airtable"},{"id":"recp9XhjZFNlIxiBM","name":"Impact Management Platform","archetype":"Other","arena":"Public policy / multilateral","levers":["Advocacy / agenda-shaping"],"themes":["Sustainability / climate","Systems change / transformation"],"participants":["Policymakers / multilateral actors","Corporate leaders / practitioners"],"website":"https://impactmanagementplatform.org/","desc":"The Platform’s mission is to cultivate an ecosystem of sustainability-related standards, frameworks, guidance and other resources that enables businesses, investors and financial institutions to manage their impacts on people and the natural environment, in adequation with the specific belief system or policy environment they operate in. The Impact Management Platform is a collaboration between leading providers of public good standards and guidance for managing sustainability impacts. Through the Platform partnering organisations aspire to: - clarify the meaning and practice of impact management; - work towards interoperability and fill gaps as needed; and - have coordinated dialogue, as appropriate, with policymakers This site supports practitioners to manage their sustainability impacts – including the impacts of their investments – by clarifying the actions of impact management and explaining how standards and guidance can be used together to enable a complete impact management practice.","city":"London","country":"United Kingdom","lat":51.51,"lng":-0.13,"geo_conf":"M","scope":"Global","region":"Europe","logo":"favicon"},{"id":"recpYNx1cSiv7uWNA","name":"Critical Edge Alliance","archetype":"Research / think tank / knowledge platform","arena":"Higher education broadly","levers":["Curriculum / pedagogy","Research / thought leadership"],"themes":["Student leadership / youth agency","Research transformation"],"participants":["Faculty / researchers","Students / young professionals"],"website":"https://www.criticaledgealliance.com/","desc":"Critical Edge Alliance is a global collaborative framework for universities that focus upon student-centered learning, critical thinking, interdisciplinary teaching and research, and social engagement. We encourage students and faculty to share experiences of learning and teaching, researchers to embark on joint projects, and administrators and staff to exchange information about the particular challenges and promises of progressive higher education.","city":"Roskilde","country":"Denmark","lat":55.64,"lng":12.08,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recpw6YamTbFlNdKd","name":"TRANSFORM - Innovation and Entrepreneurship for Sustainability","archetype":"Learning programme / course / toolkit platform","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://transform-sustainability.org/","desc":"TRANSFORM is a collaborative online course jointly designed by the Universities of Heidelberg, Mannheim, Sorbonne, Warsaw, and Copenhagen, and co-funded by 4 EU+.","city":"Heidelberg","country":"Germany","lat":49.4,"lng":8.69,"geo_conf":"M","scope":"Regional","region":"Europe","logo":"airtable"},{"id":"recqBojuTJb5V6rEq","name":"Global Network for Advanced Management","archetype":"Membership association / network","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Responsible management education","Ethics / values / humanistic leadership","Assessment / measurement / ratings"],"participants":["Faculty / researchers","Students / young professionals"],"website":"https://globalnetwork.io/","desc":"Our mission is to drive innovation and create value by connecting leading global business schools, their resources, and their stakeholders. Launched in 2012, the Global Network for Advanced Management includes 32 leading business schools from diverse regions, countries, cultures, and economies in different phases of development. A common motivation of member schools to connect is to position their students, faculty, staff, alumni and other constituencies so that they can deepen their understanding of differences and commonalities in their economies and increase their effectiveness. Member schools recognize that leaders in all sectors will be asked to contribute to the solutions of major problems that are typically complex and global. Representing a shift beyond traditional partnership models of business school collaboration, the Global Network enables the development of innovative initiatives that leverage the schools’ comparative advantages. Leveraging network efficiencies, utilizing new technologies, building strong institutional and personal relationships, and operating with a...","city":"New Haven, CT","country":"United States","lat":41.31,"lng":-72.93,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recqI8IefepFYQrqM","name":"Econa","archetype":"Membership association / network","arena":"Business education","levers":["Research / thought leadership","Convening / peer exchange"],"themes":["Student leadership / youth agency","Ethics / values / humanistic leadership","Research transformation"],"participants":["Faculty / researchers","Students / young professionals"],"website":"https://nye.econa.no/","desc":"Econa is the Norwegian association for professionals and graduates in the field of management, business and economics. Econa has over 28,000 members across all sectors, both private and public, as well as student members from Norwegian and international business schools. Econa's main goals are: - Securing good salary and employment conditions for their members. - Securing high standards of educational institutions within relevant fields. - Promoting research in the fields of economics and business administration. - Promoting high professional standards and greater attention to ethics among their members. - Providing individual services as well as social and academic events.","city":"Oslo","country":"Norway","lat":59.91,"lng":10.75,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recqpLhcSJXatdUAu","name":"Partners for a New Economy (P4NE)","archetype":"Foundation / funder / donor collaborative","arena":"Cross-sector / systems change","levers":["Funding / enabling capital"],"themes":["Sustainability / climate","Systems change / transformation"],"participants":["Funders / philanthropies"],"website":"https://p4ne.org/","desc":"Partners for a New Economy is an international donor collaborative that wants the economic system to generate positive environmental and social outcomes. They were founded in 2015 by the MAVA, Oak, Marisla and KR Foundations. Their vision is an economy that enables communities, people and nature to thrive.","city":"Geneva","country":"Switzerland","lat":46.2,"lng":6.14,"geo_conf":"M","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recr2hU5QY9t1WklS","name":"Scientists for Global Responsibility (SGR)","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Research / thought leadership","Advocacy / agenda-shaping","Convening / peer exchange"],"themes":["Ethics / values / humanistic leadership","Sustainability / climate","Inclusion / equity / justice"],"participants":["Faculty / researchers"],"website":"https://www.sgr.org.uk/","desc":"Scientists for Global Responsibility (SGR) is a membership organisation promoting responsible science and technology. Scientists for Global Responsibility (SGR): - promotes ethical science, design and technology, based on the principles of openness, accountability, peace, social justice, and environmental sustainability. - is an independent UK-based membership organisation of hundreds of natural scientists, social scientists, engineers, IT professionals and architects, supported by hundreds more outside of these professions. - carries out research, education, and advocacy work centred around the military, environmental and political aspects of science, design and technology. - provides a support network for ethically-concerned professionals in these fields. SGR is affiliated to the International Network of Engineers and Scientists for Global Responsibility (INES).","city":"Lancaster","country":"United Kingdom","lat":54.05,"lng":-2.8,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recr9nfyShGfALlXv","name":"International Association of Universities","archetype":"Membership association / network","arena":"Higher education broadly","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.iau-aiu.net/","desc":"The International Association of Universities is a membership-led non-governmental organization working in the field of higher education. It comprises more than 650 higher education institutions and organizations in some 130 countries. IAU is an official partner of UNESCO. IAU aims to be the most representative and influential global association of diverse higher education institutions and their organizations, promoting and advancing a dynamic leadership role for higher education in society.","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recr9qLdEpVmfvKZ2","name":"Earth4All","archetype":"Research / think tank / knowledge platform","arena":"Business education","levers":["Research / thought leadership","Advocacy / agenda-shaping"],"themes":["Sustainability / climate","Biodiversity / planetary boundaries","Research transformation"],"participants":["Policymakers / multilateral actors"],"website":"https://www.earth4all.life/","desc":"Earth4All started as a vibrant collective of leading economic thinkers, scientists, policy leaders, and advocates, convened by The Club of Rome, the Potsdam Institute for Climate Impact Research, the Stockholm Resilience Centre and the Norwegian Business School. With more and more people and organisations joining, Earth4All has become a platform to connect and amplify the chorus of voices that want to upgrade our economies. We are not starting from scratch. The momentum is growing. Communities and policy makers across the world are already changing the way we think economics. Earth4All builds on the legacies of The Limits to Growth and the Planetary Boundaries frameworks. Science is at the heart of our work. We rethink capitalism and move beyond GDP for a safe, secure and prosperous future in the Anthropocene.","city":"Winterthur","country":"Switzerland","lat":47.5,"lng":8.72,"geo_conf":"M","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recricfb5U4QhJWxb","name":"Higher Education Sustainability Initiative","archetype":"Public / multilateral / UN body","arena":"Higher education broadly","levers":["Advocacy / agenda-shaping"],"themes":["Responsible management education","Systems change / transformation"],"participants":["Policymakers / multilateral actors"],"website":"https://sustainabledevelopment.un.org/sdinaction/hesi","desc":"The Higher Education Sustainability Initiative (HESI), launched in the lead-up to the Rio+20 Conference in 2012 as an open partnership between several United Nations entities and the higher education community, aims to enhance the role of the higher education sector in advancing sustainable development by facilitating multi-stakeholder discussions, actions, and the dissemination of best practices. In 2024 - 2025, HESI is chaired by the United Nations Department of Economic and Social Affairs (UN DESA), UN University, UNESCO International Institute for Higher Education in Latin America and the Caribbean (IESALC), and the Sulitest Association - a non-profit organization and online platform aimed at improving sustainability literacy for all. Additional UN partners include UNESCO, UN Environment Programme, UN Global Compact’s Principles for Responsible Management Education initiative, UN-HABITAT, UNCTAD, UNITAR, UN Office for Partnerships, and UN Academic Impact. Together with hundreds of university networks, student organizations, and higher education institutions they collectively form the HESI Community. HESI Communities of Practice At the 2025 HESI Global Forum, HESI launched the HESI Partnership Framework — a mechanism designed to coordinate the contributions of its broad and growing community of over 1,300 United Nations entities, university networks, student organizations, and higher education institutions. At the heart of the framework are the HESI Communities of Practice (CoPs) — thematic groups that provide a structured, action-oriented space for members to collaborate, exchange knowledge, share innovative solutions, and co-develop relevant policy recommendations. Each CoP focuses on a critical priority area of higher education’s contribution to sustainable development:","city":"New York, NY","country":"United States","lat":40.71,"lng":-74.01,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recs8rNQupxDtxOe3","name":"GMAC","archetype":"Membership association / network","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://www.gmac.com/","desc":"The Graduate Management Admission Council (GMAC) is a global, mission-driven association of leading graduate business schools. They own and administer the Graduate Management Admission Test™ (GMAT™) exam. First administered in 1954, today, it is relied on by more than 7,000 graduate programs worldwide, and 9 out of 10 new MBA enrollments globally are made using a GMAT score.* The GMAT is the most widely used exam for graduate business school admissions, and more than 200,000 candidates take the GMAT exam every year.","city":"Reston, VA","country":"United States","lat":38.96,"lng":-77.36,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recsBXFA4RxZnLIHW"," nt of knowledge--in the social sciences, the humanities, the sciences and the arts, on undergraduate and graduate levels--across geographic and demographic boundaries, promotes civic engagement on behalf of open societies, and expands access to higher education for underserved communities. The Open Society University Network envisions a new model of global higher education—a long-lasting network with deep partnerships among diverse institutions committed to addressing global challenges collaboratively.","city":"New York, NY","country":"United States","lat":40.71,"lng":-74.01,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"rectXZSRAlHJAAFCh","name":"South African Business Schools Association (SABSA)","archetype":"Membership association / network","arena":"Business education","levers":["Research / thought leadership","Convening / peer exchange"],"themes":["Student leadership / youth agency","Ethics / values / humanistic leadership","Systems change / transformation"],"participants":["Faculty / researchers","Students / young professionals"],"website":"www.SABSA.co.za","desc":"The South African Business Schools Association (SABSA) is a key organisation representing the country’s business schools, focusing on advancing business education through collaboration, quality standards, and impactful research. With a diverse membership that spans the nation’s top academic institutions, SABSA reaches a broad network of educators, students, and industry partners, fostering a community committed to developing capable and ethical leaders. SABSA’s alignment with BE The Tipping Point centres on a shared vision of driving societal transformation through education, empowering leaders to address pressing challenges with insight, innovation, and resilience.","city":"Johannesburg","country":"South Africa","lat":-26.2,"lng":28.05,"geo_conf":"M","scope":"National","region":"Africa","logo":"airtable"},{"id":"recu4IzSgqIDWEeKe","name":"Globethics","archetype":"University alliance / academic consortium","arena":"Higher education broadly","levers":["Research / thought leadership","Advocacy / agenda-shaping","Coalition-building / field-building"],"themes":["Student leadership / youth agency","Ethics / values / humanistic leadership","Governance / institutional change"],"participants":["Policymakers / multilateral actors","Students / young professionals"],"website":"https://globethics.net/","desc":"Globethics is an international non-governmental organisation, in consultative status with UN ECOSOC, working for ethical leadership through higher education and global engagement. The organisation strives to equip individuals and institutions for ethical thinking, decision-making and action through higher education and policy engagement from cross-cultural and global perspectives. Globethics contributes to: - Knowledge development through research, a multilingual publishing house, a digital open-access library, executive training, and accredited online courses; - Governance improvement through benchmarking and institutional capacity development in ethical management, partnership and exchange of expertise, and the Consortium on Ethics in Higher Education; - Policy engagement through the Global Ethics Forum, policy dialogues, inclusive coalitions, and the Youth Leadership Award.","city":"Geneva","country":"Switzerland","lat":46.2,"lng":6.14,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recuVKHMZMNaqTpsv","name":"DECODE -\nEuropean Deans Council For Sustainable Development","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Sustainability / climate"],"participants":["Deans / rectors / presidents","Faculty / researchers"],"website":"https://decode-council.org/","desc":"DECODE Sustainability aims at fostering departmental change to institutionalize SD at the academic unit levels (faculties, schools, and departments) and better contribute to its impact. This goal will be achieved by bringing together deans and others who are responsible for driving sustainable development at the management level of academic units in a dynamic and vibrant community dedicated to enhancing departmental contributions to SD. The community will take the form of a Deans Council under a “from deans, to deans” philosophy, in which peer-exchange and peer-learning are pillars, ultimately contributing to the continuity of the project. Additionally, a web-based platform will be created. The Platform will be the place where the Council’s activity and key project results (i.e. tools, online Empowerment Program) are made available to the target groups.","city":"Lisbon","country":"Portugal","lat":38.72,"lng":-9.14,"geo_conf":"L","scope":"Regional","region":"Europe","logo":"airtable"},{"id":"recua7iUmq1Nbs2AD","name":"International Universities Climate Alliance","archetype":"Research / think tank / knowledge platform","arena":"Cross-sector / systems change","levers":["Research / thought leadership"],"themes":["Sustainability / climate","Research transformation"],"participants":["Faculty / researchers"],"website":"https://www.universitiesforclimate.org/","desc":"The Climate Alliance represents the leading research universities in climate research. Universities are uniquely placed to share knowledge and expertise, not only in climate science, but in related research fields including, adaptation and mitigation. We believe it is through collaboration that we can create greater insight and action.","city":"Sydney","country":"Australia","lat":-33.87,"lng":151.21,"geo_conf":"H","scope":"Global","region":"Asia-Pacific","logo":"airtable"},{"id":"recv5suQBwYo2APi9","name":"Good Governance Academy - ESG Exchange","archetype":"Membership association / network","arena":"Corporate / business practice","levers":["Convening / peer exchange"],"themes":["Ethics / values / humanistic leadership","Sustainability / climate","Governance / institutional change"],"participants":["Deans / rectors / presidents","Corporate leaders / practitioners"],"website":"https://goodgovernance.academy/","desc":"The Good Governance Academy is a non-profit organisation that collaborates globally to share information on critical business issues as a public good. Today summaries of the GGA's colloquia reach 5 million accountants and directors in 135 countries. The ESG Exchange within GGA is a global collaboration of standard setters, business practitioners and corporate governance experts, drawing together scarce expertise to equip firms to regularly publish timely, assurable, and comparable sustainability reports. Within the context of the Good Governance Academy’s values of Integrity, Competence, Responsibility, Accountability, Fairness, and Transparency, the ESG Exchange’s mode of operation shall be based on the principles of: - Collaboration: a global network of ethical, influential, active collaborators championing best-practice corporate reporting - Curation: a system which sources, selects, and maintains a world-wide model for corporate reporting information and tools - Evaluation and guidance: structures and global processes to promote and incentivize enterprise-wide best-practice corporate reporting -...","city":"Johannesburg","country":"South Africa","lat":-26.2,"lng":28.05,"geo_conf":"H","scope":"Global","region":"Africa","logo":"airtable"},{"id":"recvkUzgiLkgPAqOu","name":"Lewis Deep Democracy","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://www.lewisdeepdemocracy.com/","desc":"Lewis Deep Democracy gives you the support, tools and training to engage with different views and resolve conflicts unearthing creativity, innovation and transformation.","city":"Cape Town","country":"South Africa","lat":-33.92,"lng":18.42,"geo_conf":"H","scope":"Global","region":"Africa","logo":"airtable"},{ nsible for representing the common interests of establishments and schools that deliver degrees in management that are recognized by the Ministry of Higher Education, Research and Innovation. Originally founded in April 2021. by six French management schools – AUDENCIA, EDHEC, ESCP, ESSEC, HEC and SKEMA.","city":"Paris","country":"France","lat":48.86,"lng":2.35,"geo_conf":"H","scope":"National","region":"Europe","logo":"airtable"},{"id":"recx7yWZsRQzApL4k","name":"Planetary Limits Academic Network (PLAN)","archetype":"Membership association / network","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://planetarylimits.net/","desc":"The Planetary Limits Academic Network (PLAN) aims to raise awareness about critical challenges facing the human endeavor in this century by building a network of scholars across the disciplines to collectively address systemic challenges. In this way, PLAN hopes to foster a radically interdisciplinary approach to creating viable responses to a world beyond material growth that may truly achieve long-term harmonious existence with the priceless ecosystems of Earth. This website, like our network, is still very much in development, and we ultimately aim to have comprehensive search capabilities to help members connect with other scholars in different disciplines having complementary interests. If you have web development expertise and would like to help flesh this website out, please get in touch! The network currently consists of 75 Members, 7 Collaborators, and 263 Subscribers.","city":"Cambridge","country":"United Kingdom","lat":52.21,"lng":0.12,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recxGgtEvc3XAQigq","name":"Global Education Futures","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Systems change / transformation"],"participants":["Faculty / researchers"],"website":"https://globaledufutures.org/","desc":"Global Education Futures is a path breaking and paradigm forming initiative that takes on the challenge of exploring, experimenting, emerging, and engaging systemic innovation for lifelong and lifewide learning. By fostering the emergence of living learning communities, and bringing these communities into connection with each other to form socio-technical learning ecosystems, we are paving the way for a new brand of human to emerge.","city":"Moscow","country":"Russia","lat":55.76,"lng":37.62,"geo_conf":"L","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recxmapZgTF7fU71f","name":"Beta Gamma Sigma","archetype":"Student / youth network","arena":"Business education","levers":["Student activation"],"themes":["Student leadership / youth agency"],"participants":["Faculty / researchers","Students / young professionals","Corporate leaders / practitioners"],"website":"","desc":"Dayle Smith's comments: AACSB’s honor society Student org with faculty advisor but here’s the global reach and lifetime membership so as students graduate, they are alumni and business leaders","city":"St. Louis, MO","country":"United States","lat":38.63,"lng":-90.2,"geo_conf":"H","scope":"Global","region":"North America","logo":null},{"id":"recyYkGruwYOC838D","name":"The Education Commission","archetype":"Public / multilateral / UN body","arena":"Public policy / multilateral","levers":["Research / thought leadership","Advocacy / agenda-shaping"],"themes":["Research transformation"],"participants":["Policymakers / multilateral actors","Deans / rectors / presidents","Faculty / researchers"],"website":"https://educationcommission.org/","desc":"The Education Commission is a global initiative encouraging greater progress on Sustainable Development Goal 4 – ensuring inclusive and quality education and promoting lifelong learning for all. The Commission is helping to create a pathway for reform and increased investment in education by mobilizing strong evidence and analysis while engaging with world leaders, policymakers, and researchers. The Commission was co-convened in 2015 by the Prime Minister of Norway, the Presidents of Malawi, Indonesia, and Chile, and the Director-General of UNESCO. The Commission is chaired by the United Nations Special Envoy for Global Education Gordon Brown and supported by 26 high-level Commissioners. The members of the Commission include current and former heads of state and government, government ministers, three Nobel laureates, and leaders in the fields of education, business, economics, development, health, and security","city":"New York, NY","country":"United States","lat":40.71,"lng":-74.01,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recyYuWht01xsek1z","name":"Global Business School Network","archetype":"Membership association / network","arena":"Business education","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"http://gbsn.org/","desc":"The Global Business School Network is a nonprofit organization that partners with business schools, industry, foundations and aid agencies to improve access to quality, locally relevant management education for the developing world. With a growing network of over 100 leading business schools on 6 continents, we foster cross-border networking, knowledge sharing and collaboration both within our network membership and with the broader business education and development communities.","city":"Washington, DC","country":"United States","lat":38.9,"lng":-77.04,"geo_conf":"H","scope":"Global","region":"North America","logo":"airtable"},{"id":"recyb3AHBSTjvrPGg","name":"Now What?!","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website .2,"lng":28.05,"geo_conf":"H","scope":"Regional","region":"Africa","logo":"airtable"},{"id":"reczI82VZJ8VKqCY8","name":"European International Business Academy (EIBA)","archetype":"Membership association / network","arena":"Higher education broadly","levers":["Research / thought leadership","Convening / peer exchange"],"themes":["Research transformation"],"participants":["Faculty / researchers","Corporate leaders / practitioners"],"website":"https://www.eiba.org/r/home","desc":"The European International Business Academy (EIBA) is a professional society for researchers, academics and practitioners with an interest in the greater field of International Business (IB). The main mandate of EIBA is to serve the IB community as the core network in Europe for the communication and dissemination of professional information, as well as for the promotion of international exchange in the fields of International Business. EIBA was founded in 1974 under the auspices of the European Foundation for Management Development (EFMD) and in close cooperation with the European Institute for Advanced Studies in Management (EIASM) in Brussels, Belgium, where EIBA is officially registered. It is distinct from many other associations in that EIBA members come from a variety of disciplines and backgrounds yet share the common purpose and practice of the international context to bridge and cross the intellectual boundaries that so often divide institutions of higher education. Annual...","city":"Brussels","country":"Belgium","lat":50.85,"lng":4.35,"geo_conf":"H","scope":"Regional","region":"Europe","logo":"airtable"},{"id":"reczPwzTAiEDqiEOJ","name":"Institute of Noetic Sciences (IONS)","archetype":"Other","arena":"Cross-sector / systems change","levers":["Convening / peer exchange"],"themes":["Responsible management education"],"participants":["Faculty / researchers"],"website":"https://noetic.org/","desc":"At the Institute of Noetic Sciences (IONS), we are inspired by the power of science to explain phenomena not previously understood, harnessing the best of the rational mind to make advances that further our knowledge and enhance our human experience. The mission of the Institute of Noetic Sciences is to reveal the interconnected nature of reality through scientific exploration and personal discovery. As scientists focused on what are common but not often understood phenomena, we are also aware of the vast historical records of wisdom practices that also speak to the mysteries and possibilities which allow us to access more of our human capacities. At IONS, our scientists apply the rigors of their respective disciplines to explore such phenomena, with a focus on understanding humanity’s inherent interconnectedness and the inner wisdom common to us all. When we collectively embody our true interconnection and embrace our inner wisdom we envision the...","city":"Petaluma, CA","country":"United States","lat":38.23,"lng":-122.64,"geo_conf":"H","scope":"National","region":"North America","logo":"airtable"},{"id":"recvaPeFvVYkKML03","name":"FORTHEM","archetype":"University alliance / academic consortium","arena":"Higher education broadly","levers":["Convening / peer exchange"],"themes":["Social innovation / social impact","Systems change / transformation","Research transformation"],"participants":["Deans / rectors / presidents","Students / young professionals","Faculty / researchers"],"website":"https://www.forthem-alliance.eu/","desc":"FORTHEM is a network of nine multidisciplinary public research universities with a strong regional anchoring in Finland, France, Germany, Italy, Latvia, Norway, Poland, Romania and Spain. Jyväskylän yliopisto, Finland Université Bourgogne Europe, France Johannes Gutenberg-Universität Mainz, Germany Università degli Studi di Palermo, Italy Latvijas Universitāte, Latvia Universitetet i Agder, Norway Uniwersytet Opolski, Poland Universitatea Lucian Blaga din Sibiu, Romania Universitat de València, Spain","city":"Mainz","country":"Germany","lat":50.0,"lng":8.27,"geo_conf":"H","scope":"Regional","region":"Europe","logo":"airtable"},{"id":"recxaQcoFLiT1UdUQ","name":"Garrison Institute","archetype":"Research / think tank / knowledge platform","arena":"Cross-sector / systems change","levers":["Convening / peer exchange","Advocacy / agenda-shaping"],"themes":["Ethics / values / humanistic leadership"],"participants":["Corporate leaders / practitioners","Policymakers / multilateral actors"],"website":"https://www.garrisoninstitute.org/","desc":"The Garrison Institute’s mission is to apply the skills and wisdom cultivated through contemplative practice, together with the insights emerging from science, to today’s urgent social and environmental challenges, leveraging transformational change and helping to build a more compassionate, resilient future. . The Institute is part of an emerging social field of innovative contemplative-based change movements. It’s a field we helped start and continue to nurture, working to integrate contemplation, impactful action, and transformational change. We offer ongoing learning hubs and exceptional opportunities for people and organizations working in this field to be in a supportive, empowering community. And we continue to advance the field through our own groundbreaking contemplative-based, secular programs in key social and environmental program initiatives: Contemplative Based Resilience, Pathways to Planetary Health, and others.","city":"Garrison, NY","country":"United States","lat":41.38,"lng":-73.95,"geo_conf":"H","scope":"National","region":"North America","logo":"airtable"},{"id":"recXhVWWOPFMxfeN8","name":"ACEEU","archetype":"Accreditation / standards / rating body","arena":"Higher education broadly","levers":["Accreditation / quality assurance"],"themes":["Social innovation / social impact"],"participants":["Accrediting / QA professionals"],"website":"https://www.aceeu.org/","desc":"The Accreditation Council for Entrepreneurial and Engaged Universities (ACEEU) is the only globally-operating quality assurance body with a focus on acknowledging engagement and entrepreneurship in Higher Education. As such, ACEEU strives to lead the way in a new era for higher education through evaluating, supporting and igniting the potential of HEIs on their road to third mission excellence. Headquartered in Germany, ACEEU offers accreditation for entrepreneurship and (community) engagement on institutional (entire university) and divisional level (faculty, school, department). Universities engaging in ACEEU accreditation are united by their excellence in entrepreneurship and engagement, no matter if top 1% world university, or less known regionally-oriented institution.","city":"Münster","country":"Germany","lat":51.96,"lng":7.63,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"},{"id":"recBSIS2026efmd01","name":"BSIS – Business School Impact System","archetype":"Accreditation / standards / rating body","arena":"Business education","levers":["Standards / benchmarks / assessment","Accreditation / quality assurance","Whole-institution transformation","Public narrative / media / visibility"],"themes":["Assessment / measurement / ratings","Social innovation / social impact","Responsible management education","Governance / institutional change"],"participants":["Deans / rectors / presidents","Accrediting / QA professionals"],"website":"https://www.efmdglobal.org/accreditations-assessments/business-schools/bsis/","desc":"BSIS (Business School Impact System) is EFMD Global’s comprehensive impact assessment tool for business schools. Built around 120 indicators across seven dimensions — financial, educational, business development, intellectual, regional ecosystem, societal and image impact — it helps schools document, assess and communicate their tangible and intangible contribution to their environment. Launched in 2012 and run jointly by EFMD Global and FNEGE, BSIS combines structured data collection with expert review and has assessed more than 100 business schools worldwide.","city":"Brussels","country":"Belgium","lat":50.85,"lng":4.35,"geo_conf":"H","scope":"Global","region":"Europe","logo":"airtable"}]</script>

  if(tweenMarks.blooming && !bloomPending){ clear(); return; }

  gNodes.selectAll('circle.node').each(function(d){ if(this.__enter){ entering.push(this); } else if(this.__from && (Math.abs(this.__from.cx-d.x)>0.5||Math.abs(this.__from.cy-d.y)>0.5)){ moved.push([this,this.__from,d]); } this.__from=null; this.__enter=false; });

    moved.forEach(([el,from,d],i)=>G.fromTo(el,{attr:{cx:from.cx,cy:from.cy,r:3.75}},{attr:{cx:d.x,cy:d.y,r:Math.max(1.4,(d.r-0.6)*1.2)},duration:.9,ease:'expo.out',delay:Math.min(.5,i*.004)}));
    gGroups.selectAll('circle').style('opacity',1).each(function(d){ this.__from=null; G.fromTo(this,{attr:{r:d.r*0.6}},{attr:{r:d.r},duration:.9,ease:'back.out(1.2)'}); });
    gLabels.selectAll('text.group-label').style('opacity',0).transition().duration(500).delay(500).style('opacity',1);
    return; }
  moved.forEach(([el,from,d])=>G.fromTo(el,{attr:{cx:from.cx,cy:from.cy}},{attr:{cx:d.x,cy:d.y},duration:.5,ease:EASE}));
  if(entering.length){ entering.sort((a,b)=>(groups.indexOf(a.__data__.parent)-groups.indexOf(b.__data__.parent))); G.fromTo(entering,{scale:0,transformOrigin:'50% 50%'},{scale:1,duration:.5,ease:EASE,stagger:{each:Math.min(.004,.6/entering.length)},clearProps:'transform'}); }

}

function setActive(i){ sItems.forEach(x=>x.setAttribute('aria-selected','false')); sActive=i; const it=sItems[i]; if(it){ it.setAttribute('aria-selected','true'); sInput.setAttribute('aria-activedescendant',it.id); it.scrollIntoView({block:'nearest'}); } else sInput.removeAttribute('aria-activedescendant'); }

// three detents: peek (120px) · half · full (44px of map stay visible); dragged from the handle only, snapped with velocity
let sheetDetent='half', lastSheetKind='';
function detentPx(d){ const Hm=document.querySelector('main').clientHeight; return d==='peek'?120:d==='half'?Math.round(Hm*0.5):(obMode?Math.round(Hm*0.7):Math.max(200,Hm-44)); }
// the sheet height is mirrored in --sheet-h so the zoom stack and the mosaic layout stay above it
let sheetRelayout=0; function setSheetVar(px){ document.documentElement.style.setProperty('--sheet-h',Math.round(px)+'px'); }
function afterDetent(){ if(!narrowMQ.matches) return; clearTimeout(sheetRelayout); sheetRelayout=setTimeout(()=>{ if(viewMode==='clusters' && !scattered && !document.body.classList.contains('onboarding')){ const name=focusGroup&&!focusGroup.region?focusGroup.data.name:null; layout(); if(name){ focusGroup=groups.find(g=>g.data.name===name)||null; if(focusGroup){ zoomTo(focusGroup.x,focusGroup.y,focusGroup.r,400); applyState(); } } } },40); }
function setDetent(d,animate=true){ const el=document.getElementById('detail'); sheetDetent=d; if(d==='peek') legendAutoOpen(); const px=detentPx(d); document.body.classList.toggle('sheet-full',d==='full'); if(animate && motion()){ G.to(el,{height:px,duration:.45,ease:EASE2,overwrite:true,onUpdate:()=>setSheetVar(el.offsetHeight),onComplete:()=>{ setSheetVar(px); afterDetent(); if(d==='full') revealSections(document.getElementById('detailBody'),true); }}); } else { if(G) G.killTweensOf(el); el.style.height=px+'px'; setSheetVar(px); afterDetent(); } }
(function(){ const h=document.getElementById('sheetHandle'), el=document.getElementById('detail'); if(!h) return; let drag=null;
  h.addEventListener('pointerdown',e=>{ if(!narrowMQ.matches) return; h.setPointerCapture(e.pointerId); if(G) G.killTweensOf(el); drag={y0:e.clientY,h0:el.getBoundingClientRect().height,t0:performance.now(),last:[e.clientY,performance.now()],vel:0}; });
  h.addEventListener('pointermove',e=>{ if(!drag) return; const dy=e.clientY-drag.y0; const Hm=document.querySelector('main').clientHeight; const nh=Math.max(80,Math.min(Hm-44,drag.h0-dy)); el.style.height=nh+'px'; setSheetVar(nh); const now=performance.now(); if(now-drag.last[1]>16){ drag.vel=(e.clientY-drag.last[0])/(now-drag.last[1]); drag.last=[e.clientY,now]; } });
  const end=e=>{ if(!drag) return; const v=drag.vel, hNow=el.getBoundingClientRect().height, from=sheetDetent; drag=null; const order=['peek','half','full']; let target; if(Math.abs(v)>0.5){ const i=order.indexOf(from); target=v<0?order[Math.min(2,i+1)]:(i===0?'close':order[i-1]); } else { const cands=order.map(d=>[Math.abs(detentPx(d)-hNow),d]).sort((a,b)=>a[0]-b[0]); target=cands[0][1]; if(target==='peek' && hNow<70) target='close'; } if(target==='close'){ closeDetailSheet(); return; } if(from==='peek' && target!=='peek') revealSections(document.getElementById('detailBody'),true); setDetent(target,true); };
  h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
})();

const scatterPos=new Map(); const rng=d3.randomLcg(7);
function scatterOf(o){ if(!scatterPos.has(o.id)) scatterPos.set(o.id,[0.08+rng()*0.84, 0.1+rng()*0.8]); const p=scatterPos.get(o.id); return [p[0]*W,p[1]*H]; }
function setScatter(on){
  scattered=on; const dur=reduced?0:(on?700:550);
  if(G) G.killTweensOf(gNodes.selectAll('circle.node').nodes());
  if(!on && motion() && !zooming && leaves.length<=160){ bloomPending=true; gLinks.selectAll('*').remove(); return; } // the bloom itself runs in tweenMarks on the next draw()
  gNodes.selectAll('circle.node').transition().duration(dur).delay(d=>on||reduced?0:Math.max(0,groups.indexOf(d.parent))*40).ease(d3.easeCubicOut)
    .attr('cx',d=>on?scatterOf(d.data.org)[0]:d.x).attr('cy',d=>on?scatterOf(d.data.org)[1]:d.y).attr('r',d=>on?3.75:Math.max(1.4,(d.r-0.6)*1.2));
  gGroups.selectAll('circle').transition().duration(dur).style('opacity',on?0:1);
  gLabels.selectAll('text.group-label').transition().duration(dur).style('opacity',on?0:1);
  gLinks.selectAll('*').remove();
}

function startOnboarding(step){
  obPrev=profile; obDraft={role:profile?.role||null,themes:(profile?.themes||[]).slice(),region:profile?.region||null,wants:(profile?.wants||[]).slice()};
  document.body.classList.add('onboarding'); companionOpen=false; selectedJunction=null; selectedIni=null; if(orgFlow) orgFlow.hidden=true; select(null); focusGroup=null; svg.call(zoom.transform,d3.zoomIdentity); obMode='steps';
  setTimeout(()=>{ layout(); goStep(step); },30);
}
function goStep(i){
  obStep=Math.max(0,Math.min(STEPS.length-1,i)); obMode='steps'; const s=STEPS[obStep];
  s.enter(); renderDetail();
}
function renderStepsPanel(el){
  const s=STEPS[obStep]; if(!s) return;
  el.innerHTML=`<div class="onb-panel">${s.render()}<div class="dots">${STEPS.map((_,k)=>`<i class="${k===obStep?'on':''}"></i>`).join('')}</div><div class="kbd">${t('ob.kbd')}</div></div>`;
  el.querySelector('[data-next]')?.addEventListener('click',()=>goStep(obStep+1));
  el.querySelector('[data-prev]')?.addEventListener('click',()=>goStep(obStep-1));
  el.querySelector('[data-skip]')?.addEventListener('click',()=>endOnboarding(false));
  el.querySelector('[data-finish]')?.addEventListener('click',()=>endOnboarding(true));
  el.querySelector('[data-addorg]')?.addEventListener('click',()=>{ endOnboarding(true); setTimeout(()=>startOrgFlow(),80); });
  el.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ obDraft.role=b.dataset.role; goStep(obStep); });
  el.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{ obDraft.region=b.dataset.region; goStep(obStep); });
  el.querySelectorAll('[data-want]').forEach(b=>b.onclick=()=>{ const k=b.dataset.want; const x=obDraft.wants.indexOf(k); if(x>=0) obDraft.wants.splice(x,1); else obDraft.wants.push(k); goStep(obStep); });
  el.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{ const k=b.dataset.theme; const x=obDraft.themes.indexOf(k); if(x>=0) obDraft.themes.splice(x,1); else if(obDraft.themes.length<3) obDraft.themes.push(k); goStep(obStep); });
  el.querySelector('.primary')?.focus({preventScroll:true});
}
function endOnboarding(keep){
  if(keep && (obDraft.role||obDraft.themes.length||obDraft.region||obDraft.wants.length)) profile={role:obDraft.role,themes:obDraft.themes.slice(),region:obDraft.region,wants:obDraft.wants.slice()}; else profile=null;
  saveProfile();
  document.body.classList.remove('onboarding'); onb.hidden=true; obStep=-1; obMode=null; legendAutoOpen();
  if(scattered) setScatter(false);
  if(!profile && viewMode==='map') setView('clusters');
  setTimeout(()=>{ layout(); renderHint(); renderDetail(); if(profile?.region && viewMode==='map') zoomToRegion(profile.region,0); },30);
}
