const kwPick=(text,list,max)=>{ const out=[]; for(const [re,v] of list){ if(re.test(text) && !out.includes(v)) out.push(v); if(out.length>=max) break; } return out; };
function rulesSuggest(d){
  const text=`${d.name||''}. ${d.desc||''}`;
  const themes=kwPick(text,KW.themes,3), levers=kwPick(text,KW.levers,3), participants=kwPick(text,KW.participants,2);
  const archetype=kwPick(text,KW.archetypes,1)[0]||'Other';
  const resources=[]; for(const [re,type,lk] of KW.resources){ if(re.test(d.desc||'') && resources.length<3) resources.push({type,title:`${(d.name||'Our').trim()} — ${t(lk)}`}); }
  let summary=(d.desc||'').split(/(?<=[.!?])\s+/)[0].trim(); if(summary.length>180) summary=summary.slice(0,177).trim()+'…';
  return {summary,archetype,themes,levers,participants,resources,confidence:'rules'};
}
const onlyKnown=(arr,vocab)=>Array.isArray(arr)?arr.filter(v=>vocab.includes(v)):[];
// AI step: ask Claude through the artifact runtime when the page runs inside a Claude viewer; otherwise (static site) keyword rules
async function aiSuggest(draft){
  const fallback=rulesSuggest(draft);
  try{
    if(!window.claude?.use) return fallback;
    const sample=await claude.use('sample'); if(!sample) return fallback;
    const prompt=`You help an organisation describe itself for an ecosystem map of actors helping business education flourish.
Return STRICT JSON only, no prose, with this shape:
{"summary": string (one sentence, max 180 characters, third person, plain and specific),
 "archetype": one of ${JSON.stringify(VOCAB.archetypes)},
 "themes": up to 3 of ${JSON.stringify(VOCAB.themes)},
 "levers": up to 3 of ${JSON.stringify(VOCAB.levers)},
 "participants": up to 2 of ${JSON.stringify(VOCAB.participants)},
 "resources": up to 3 objects {"type": one of ${JSON.stringify(VOCAB.rtypes)}, "title": short title} for things the description says the organisation produces or offers (reports, standards, courses, programmes, tools, gatherings); [] if none}
Use the exact strings given. Organisation name: ${JSON.stringify(draft.name||'')}. Website: ${JSON.stringify(draft.website||'')}. Description: ${JSON.stringify(draft.desc||'')}`;
    const j=await sample.json(prompt,{modelTier:'quick',cache:false});
    if(!j||typeof j!=='object') return fallback;
    return {summary:typeof j.summary==='string'&&j.summary.trim()?j.summary.trim().slice(0,200):fallback.summary,
      archetype:VOCAB.archetypes.includes(j.archetype)?j.archetype:fallback.archetype,
      themes:onlyKnown(j.themes,VOCAB.themes).slice(0,3).length?onlyKnown(j.themes,VOCAB.themes).slice(0,3):fallback.themes,
      levers:onlyKnown(j.levers,VOCAB.levers).slice(0,3).length?onlyKnown(j.levers,VOCAB.levers).slice(0,3):fallback.levers,
      participants:onlyKnown(j.participants,VOCAB.participants).slice(0,2).length?onlyKnown(j.participants,VOCAB.participants).slice(0,2):fallback.participants,
      resources:(Array.isArray(j.resources)?j.resources:[]).filter(r=>r&&VOCAB.rtypes.includes(r.type)&&typeof r.title==='string').slice(0,3).map(r=>({type:r.type,title:r.title.slice(0,120)})),
      confidence:'ai'};
  }catch(e){ return fallback; }
}

const aiTag=()=>orgFlow?.ai?`<span class="ai-tag">${orgFlow.ai.confidence==='ai'?t('ai.tag'):t('rules.tag')}</span>`:'';
function answerText(st,d){
  switch(st.kind){ case 'contact': return `${d.contactName} · ${d.contactEmail}`; case 'place': return [d.city,d.country].filter(Boolean).join(', ')+(d.region?` · ${label(d.region)}`:''); case 'single': return label(d.archetype); case 'multi': return (d[st.key]||[]).map(label).join(', '); case 'resources': return [...d.resources.map(r=>`${resIcon(r.type)} ${r.title}`),...(d.events||[]).map(e=>`◆ ${e.title}`)].join(' · ')||t('flow.nothing'); case 'wants': return (d.wants.map(k=>resLabel(k)).join(', ')||t('flow.notspecified'))+(d.intent?` — “${d.intent}”`:''); case 'initiative': return d.initiative||t('flow.ini.none'); default: return d[st.key]||'—'; } }
function chipsHtml(vocab,sel,attr,max){ return `<div class="chips">${VOCAB[vocab].map(v=>`<button class="chip" ${attr}="${esc(v)}" aria-pressed="${sel.includes(v)}" ${max&&!sel.includes(v)&&sel.length>=max?'disabled':''}>${esc(label(v))}</button>`).join('')}</div>`; }

    if(FLOW_STEPS[i].key==='desc'){ if(f.aiStatus==='running') bubbles.push(`<div class="bub a thinking">${t('flow.thinking')}</div>`); else if(f.ai) bubbles.push(`<div class="bub a">${t('flow.ai')} ${aiTag()}<div class="ai-sum">“${esc(f.ai.summary)}”</div><div class="ai-list"><span class="k">${t('flow.ai.type')}</span> ${esc(label(f.ai.archetype))}<br><span class="k">${t('flow.ai.themes')}</span> ${f.ai.themes.map(x=>esc(label(x))).join(', ')||'—'}<br><span class="k">${t('flow.ai.levers')}</span> ${f.ai.levers.map(x=>esc(label(x))).join(', ')||'—'}<br><span class="k">${t('flow.ai.works')}</span> ${f.ai.participants.map(x=>esc(label(x))).join(', ')||'—'}${f.ai.resources.length?`<br><span class="k">${t('flow.ai.shares')}</span> ${f.ai.resources.map(r=>esc(r.title)).join(', ')}`:''}</div><div class="help" style="margin:6px 0 0">${t('flow.ai.next')}</div></div>`); } }
  let input='';

    else if(st.kind==='place') input=`<div class="row2"><input id="fCity" type="text" placeholder="${t('q.city')}" value="${esc(d.city)}"><input id="fCountry" type="text" placeholder="${t('q.country')}" value="${esc(d.country)}"></div><div class="help" style="margin:6px 0 4px">${d.region?t('q.region.detected',{r:esc(label(d.region))}):t('q.region.pick')}</div><div class="chips">${REGIONS.map(r=>`<button class="chip" data-region="${esc(r)}" aria-pressed="${d.region===r}">${esc(label(r))}</button>`).join('')}</div>`;

    else if(st.kind==='resources'){ const sugg=(f.ai?.resources||[]).filter(x=>!d.resources.some(r=>r.title===x.title)); d.events=d.events||[]; input=`${d.resources.length||d.events.length?`<ul class="mini-list">${d.resources.map((r,i)=>`<li><span>${resIcon(r.type)} <b>${esc(r.title)}</b>${r.url?` · <a href="${esc(r.url)}" target="_blank" rel="noopener">${t('flow.link')}</a>`:''}</span><button class="xbtn" data-rm="${i}" aria-label="${t('flow.remove')}">×</button></li>`).join('')}${d.events.map((e,i)=>`<li><span>◆ <b>${esc(e.title)}</b> · ${esc(e.date)} · ${esc(e.city)}</span><button class="xbtn" data-rmev="${i}" aria-label="${t('flow.remove')}">×</button></li>`).join('')}</ul>`:''}${sugg.length?`<div class="help" style="margin:0 0 4px">${t('flow.sugg')}</div><div class="chips" style="margin-bottom:8px">${sugg.map(x=>`<button class="chip more" data-sugg="${esc(x.title)}" data-sugg-type="${x.type}">${resIcon(x.type)} ${esc(x.title)}</button>`).join('')}</div>`:''}<div class="mini-form"><div class="chips">${VOCAB.rtypes.map(k=>`<button class="chip" data-rtype="${k}" aria-pressed="${(f.curType||'')===k}">${esc(resLabel(k))}</button>`).join('')}</div><input id="fRTitle" type="text" placeholder="${t('flow.rtitle.ph')}" value="${esc(f.curTitle||'')}"><input id="fRUrl" type="url" placeholder="${t('flow.rurl.ph')}" value="${esc(f.curUrl||'')}"><div class="pop-actions"><button class="btn" id="fAddRes">${t('flow.addanother')}</button><button class="btn ghost" id="fEvToggle" aria-expanded="${!!f.evOpen}">◆ ${t('flow.event')}</button></div>${f.evOpen?`<div class="mini-form" style="background:var(--surface2)"><input id="fEvTitle" type="text" placeholder="${t('flow.ev.title')}" value="${esc(f.evTitle||'')}"><div class="row2"><input id="fEvDate" type="date" placeholder="${t('flow.ev.date')}" value="${esc(f.evDate||'')}"><input id="fEvCity" type="text" placeholder="${t('flow.ev.city')}" value="${esc(f.evCity||'')}"></div><input id="fEvUrl" type="url" placeholder="${t('flow.ev.url')}" value="${esc(f.evUrl||'')}"><div class="pop-actions"><button class="btn" id="fAddEv">${t('flow.ev.add')}</button></div><div class="help">${t('flow.ev.help')}</div></div>`:''}</div>`; }
    else if(st.kind==='initiative') input=`<div class="chips ini-pick">${INI.map(i=>`<button class="chip" data-ini="${esc(i.id)}" aria-pressed="${d.initiative===iniTitle(i)}">✦ ${esc(iniTitle(i))}</button>`).join('')}</div><input id="fIni" type="text" placeholder="${t('q.initiative.ph')}" value="${esc(INI.some(i=>iniTitle(i)===d.initiative)?'':(d.initiative||''))}" style="margin-top:8px">`;
    else if(st.kind==='wants') input=`<div class="chips">${VOCAB.rtypes.map(k=>`<button class="chip" data-want="${k}" aria-pressed="${d.wants.includes(k)}">${esc(resLabel(k))}</button>`).join('')}</div><textarea id="fIntent" rows="2" placeholder="${t('q.intent.ph')}" style="margin-top:8px">${esc(d.intent)}</textarea>`;
  }
  el.innerHTML=`<div class="chat" id="chat"><div class="prog"><span><span class="panel-title sm">${t('flow.title')}</span> · ${f.review?t('flow.review'):t('flow.of',{a:f.step+1,b:N})}</span><button class="xbtn" id="flowClose" aria-label="${t('close')}" title="${t('flow.close')}">×</button></div>${bubbles.join('')}${f.review?`<div class="bub a">${t('rv.bubble')}</div>`:''}</div>
    ${f.review?reviewCardHtml(d):''}
    <div class="chat-input" id="chatInput">${input}${f.review?`<div class="nav2" style="margin-top:0"><button class="btn primary-cta" id="fPublish">${myOrg&&myOrg.status?t('rv.submitupdate'):t('rv.submit')}</button><button class="btn" id="fEdit">${t('rv.editanswers')}</button></div>`:`<div class="nav2"><button class="btn ghost" id="fBack" ${f.step===0?'disabled':''}>${t('flow.back')}</button><button class="btn primary-cta" id="fNext">${f.step===N-1?t('flow.reviewbtn'):FLOW_STEPS[f.step].kind==='resources'?t('flow.done'):t('flow.next')}</button>${FLOW_STEPS[f.step].required?'':`<button class="btn ghost" id="fSkip">${t('flow.skip')}</button>`}</div>`}</div>`;
  bindOrgFlow(el);
  const aside=document.getElementById('detail'); const toEnd=()=>{ aside.scrollTop=aside.scrollHeight; }; requestAnimationFrame(()=>{ toEnd(); const fi=el.querySelector('#fIn,#fCity'); if(fi && !narrowMQ.matches) fi.focus({preventScroll:true}); }); setTimeout(toEnd,80);
}

    <section class="sec">${secH(t('sec.about'))}<p class="desc">${esc(o.desc)}</p>${orgFlow?.ai?.summary&&orgFlow.ai.summary!==o.desc?`<p class="help">${t('rv.shorter')} ${aiTag()}: “${esc(orgFlow.ai.summary)}” <button class="readmore" id="useSummary">${t('rv.useit')}</button></p>`:''}</section>
    <section class="sec">${secH(t('sec.focus'))}<dl class="focus"><dt>${t('focus.themes')}</dt><dd><div class="plain">${o.themes.map(x=>esc(label(x))).join(', ')||'—'}</div></dd><dt>${t('focus.levers')}</dt><dd><div class="plain">${o.levers.map(x=>esc(label(x))).join(', ')}</div></dd><dt>${t('focus.who')}</dt><dd><div class="plain">${o.participants.map(x=>esc(label(x))).join(', ')||'—'}</div></dd></dl></section>
    <section class="sec">${secH(t('rv.shares'),res.length+(d.events||[]).length)}${res.length||(d.events||[]).length?`<ul class="reslist">${res.map(r=>`<li class="rescard"><div class="rt"><span class="ri">${resIcon(r.type)}</span><span class="rk">${esc(resLabel(r.type))}</span></div><h4 class="rtitle" style="cursor:default">${esc(r.title)}</h4>${r.url?`<a class="rlink" href="${esc(r.url)}" target="_blank" rel="noopener">${t('rv.open')}</a>`:''}</li>`).join('')}${(d.events||[]).map(e=>`<li class="rescard"><div class="rt"><span class="ri">◆</span><span class="rk">${t('rv.events')} · ${esc(e.date)}</span></div><h4 class="rtitle" style="cursor:default">${esc(e.title)}</h4><p class="rsum">${esc(e.city)}</p></li>`).join('')}</ul>`:`<p class="kempty">${t('rv.nothing')}</p>`}</section>
    <section class="sec">${secH(t('rv.looking'))}<p class="plain" style="margin:0;font-size:13px">${d.wants.map(k=>esc(resLabel(k))).join(', ')||'—'}${d.intent?`<br><span class="help" style="display:block;margin-top:4px">“${esc(d.intent)}”</span>`:''}</p></section>

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function stepValid(st,d){ if(st.kind==='contact') return !!d.contactName.trim() && EMAIL_RE.test(d.contactEmail.trim()); if(st.required && !(d[st.key]||'').trim()) return false; return true; }
function readStepInputs(el){ const f=orgFlow, d=f.draft, st=FLOW_STEPS[f.step]; if(!st) return;
  if(st.kind==='text'||st.kind==='url'||st.kind==='textarea'){ d[st.key]=(el.querySelector('#fIn')?.value||'').trim(); }
  if(st.kind==='initiative'){ const v=(el.querySelector('#fIni')?.value||'').trim(); if(v) d.initiative=v; }
  if(st.kind==='contact'){ d.contactName=(el.querySelector('#fCName')?.value||'').trim(); d.contactEmail=(el.querySelector('#fCEmail')?.value||'').trim(); }
  if(st.kind==='place'){ d.city=(el.querySelector('#fCity')?.value||'').trim(); d.country=(el.querySelector('#fCountry')?.value||'').trim(); if(!d.regionManual) d.region=regionFor(d.country)||d.region; }
  if(st.kind==='resources'){ f.curTitle=el.querySelector('#fRTitle')?.value||''; f.curUrl=el.querySelector('#fRUrl')?.value||''; f.evTitle=el.querySelector('#fEvTitle')?.value||f.evTitle||''; f.evDate=el.querySelector('#fEvDate')?.value||f.evDate||''; f.evCity=el.querySelector('#fEvCity')?.value||f.evCity||''; f.evUrl=el.querySelector('#fEvUrl')?.value||f.evUrl||''; }
  if(st.kind==='wants'){ d.intent=(el.querySelector('#fIntent')?.value||'').trim(); }
}
function pushCurResource(){ const f=orgFlow; const t=(f.curTitle||'').trim(); if(!t) return false; f.draft.resources.push({type:f.curType||'programme',title:t,url:(f.curUrl||'').trim()}); f.curTitle=''; f.curUrl=''; f.curType=''; return true; }
function applyAi(ai){ const d=orgFlow.draft, ed=orgFlow.edited; if(!ed.has('archetype')&&!d.archetype) d.archetype=ai.archetype; if(!ed.has('themes')&&!d.themes.length) d.themes=ai.themes.slice(); if(!ed.has('participants')&&!d.participants.length) d.participants=ai.participants.slice(); if(!d.levers.length) d.levers=ai.levers.slice(); }
async function runAi(){ const f=orgFlow; f.aiStatus='running'; renderDetail(); const ai=await aiSuggest(f.draft); if(orgFlow!==f) return; f.ai=ai; f.aiStatus='done'; applyAi(ai); renderDetail(); }
function bindOrgFlow(el){
  const f=orgFlow, d=f.draft, st=FLOW_STEPS[f.step];
  el.querySelector('#flowClose').onclick=()=>{ readStepInputs(el); if(narrowMQ.matches) closeDetailSheet(); else { orgFlow.hidden=true; renderDetail(); } };
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ readStepInputs(el); f.review=false; f.step=+b.dataset.edit; renderDetail(); });
  const next=()=>{ readStepInputs(el); if(!stepValid(st,d)){ if(st.kind==='contact'){ const bad=!d.contactName.trim()?'#fCName':'#fCEmail'; el.querySelector(bad)?.classList.add('bad'); el.querySelector(bad)?.focus(); return; } el.querySelector('#fIn')?.focus(); el.querySelector('#fIn')?.classList.add('bad'); return; }
    if(st.kind==='resources') pushCurResource();
    if(st.kind==='single'||st.kind==='multi') f.edited.add(st.key);
    if(st.key==='desc' && (f.aiStatus==='idle' || f.aiFor!==d.desc)){ f.aiFor=d.desc; f.step++; runAi(); return; }
    if(f.step===FLOW_STEPS.length-1){ f.review=true; } else f.step++;
    renderDetail(); };
  el.querySelector('#fNext')?.addEventListener('click',next);
  el.querySelector('#fSkip')?.addEventListener('click',()=>{ if(st.kind==='resources'){ f.curTitle=''; } if(f.step===FLOW_STEPS.length-1) f.review=true; else f.step++; renderDetail(); });
  el.querySelector('#fBack')?.addEventListener('click',()=>{ readStepInputs(el); f.step=Math.max(0,f.step-1); renderDetail(); });
  el.querySelectorAll('#fIn,#fCity,#fCountry,#fCName,#fCEmail,#fRTitle,#fRUrl').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter' && !(i.tagName==='TEXTAREA' && !(e.metaKey||e.ctrlKey))){ e.preventDefault(); if(i.id==='fRTitle'||i.id==='fRUrl') el.querySelector('#fAddRes').click(); else next(); } }));
  el.querySelectorAll('#fIn,#fCName,#fCEmail').forEach(i=>i.addEventListener('input',e=>e.target.classList.remove('bad')));
  el.querySelector('#fCountry')?.addEventListener('input',e=>{ const r=regionFor(e.target.value); if(r && !d.regionManual){ d.region=r; el.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.region===r)); } });
  el.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{ readStepInputs(el); d.region=b.dataset.region; d.regionManual=true; renderDetail(); });
  el.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>{ d.archetype=b.dataset.one; f.edited.add('archetype'); renderDetail(); });
  el.querySelectorAll('[data-many]').forEach(b=>b.onclick=()=>{ const v=b.dataset.many, arr=d[st.key]; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else if(!st.max||arr.length<st.max) arr.push(v); f.edited.add(st.key); renderDetail(); });
  el.querySelectorAll('[data-rtype]').forEach(b=>b.onclick=()=>{ readStepInputs(el); f.curType=b.dataset.rtype; renderDetail(); el.querySelector('#fRTitle')?.focus(); });
  el.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>{ readStepInputs(el); f.curTitle=b.dataset.sugg; f.curType=b.dataset.suggType; renderDetail(); });
  el.querySelector('#fAddRes')?.addEventListener('click',()=>{ readStepInputs(el); if(!pushCurResource()){ el.querySelector('#fRTitle').focus(); return; } renderDetail(); });
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ readStepInputs(el); d.resources.splice(+b.dataset.rm,1); renderDetail(); });
  el.querySelectorAll('[data-rmev]').forEach(b=>b.onclick=()=>{ readStepInputs(el); d.events.splice(+b.dataset.rmev,1); renderDetail(); });
  el.querySelector('#fEvToggle')?.addEventListener('click',()=>{ readStepInputs(el); f.evOpen=!f.evOpen; renderDetail(); });
  el.querySelector('#fAddEv')?.addEventListener('click',()=>{ readStepInputs(el); if(!(f.evTitle||'').trim()||!f.evDate){ el.querySelector(!(f.evTitle||'').trim()?'#fEvTitle':'#fEvDate')?.focus(); return; } d.events.push({title:f.evTitle.trim(),date:f.evDate,city:(f.evCity||'').trim(),url:(f.evUrl||'').trim()}); f.evTitle=f.evDate=f.evCity=f.evUrl=''; f.evOpen=false; renderDetail(); });
  el.querySelectorAll('[data-ini]').forEach(b=>b.onclick=()=>{ const i=iniById.get(b.dataset.ini); const title=i?iniTitle(i):''; d.initiative=d.initiative===title?'':title; const fi=el.querySelector('#fIni'); if(fi) fi.value=''; renderDetail(); });
  el.querySelectorAll('[data-want]').forEach(b=>b.onclick=()=>{ readStepInputs(el); const t=b.dataset.want, i=d.wants.indexOf(t); if(i>=0) d.wants.splice(i,1); else d.wants.push(t); renderDetail(); });
  el.querySelector('#useSummary')?.addEventListener('click',()=>{ d.desc=orgFlow.ai.summary; renderDetail(); });
  el.querySelector('#fPublish')?.addEventListener('click',submitMyOrg);
  el.querySelector('#fEdit')?.addEventListener('click',()=>{ f.review=false; f.step=0; renderDetail(); });
}
function statusBanner(o){
  const when=o.submittedAt?new Date(o.submittedAt).toLocaleDateString(LOCALE(),{day:'numeric',month:'short',year:'numeric'}):'';
  if(o.status==='changes_requested') return `<div class="banner warn"><div class="eyebrow">${t('bn.changes')} · ${esc(o.ref||'')}</div><p>${t('bn.changes.p',{note:esc(o.modNote==='__sample__'?t('mod.note'):o.modNote)})}</p><div class="pop-actions"><button class="btn primary-cta" id="bEdit">${t('bn.editresubmit')}</button><button class="btn ghost" id="bWithdraw">${t('bn.withdraw')}</button></div></div>`;

  if(o.status==='approved') return '';

// ---- rule engine ----
function rulesInterpret(raw,preset){
  const txt=norm(raw); const actions=[...(preset||[])]; let path=comp.path; const blocks=[]; let text=''; let handled=!!preset;
  const removing=/\b(enleve|retire|sauf|cache|sans|remove|hide|without|except|exclude)\b/.test(txt); const only=/\b(seulement|uniquement|only|just)\b/.test(txt);
  if(!preset){
    if(/\b(reset|reinitialis|recommenc|tout effacer|clear all|start over|efface|repart)/.test(txt)){ actions.push({type:'clearFilters'},{type:'setView',view:'clusters'}); handled=true; path={name:'restart',step:0}; }
    if(/\b(panorama)\b/.test(txt)){ actions.push({type:'setView',view:'panorama'}); handled=true; }
    else if(/\b(carte du monde|carte|world map|map|monde|ou se trouv|where are|where is)\b/.test(txt)){ actions.push({type:'setView',view:'map'}); handled=true; }
    else if(/\b(savoirs|knowledge|ressources partagees|shared resources)\b/.test(txt)){ actions.push({type:'setView',view:'knowledge'}); handled=true; }
    else if(/\b(grappes|clusters|liste|list)\b/.test(txt)){ actions.push({type:'setView',view:'clusters'}); handled=true; }
    if(/(diff[ée]rence|difference|versus|\bvs\b).*(prototype|soutenu|supported)|(prototype soutenu|supported prototype)/.test(txt)){ return {actions:[],reply:{text:t('c.origin'),blocks:[{type:'chips',items:[chip(t('view.pan'),null,[{type:'setView',view:'panorama'}]),chip(t('c.i.initiative'),null,null,'initiative')]}]},path:null,handled:true}; }
    if(/(symbole|losange|ic[oô]ne|l[ée]gende|legend|symbol|icon|diamond|pictogram|que veulent dire|what do the)/.test(txt)){ return {actions:[],reply:{text:t('c.symbols'),blocks:[{type:'chips',items:[chip(t('c.symbols.open'),null,[{type:'openLegend'}]),...furtherChips().slice(0,2)]}]},path:null,handled:true}; }
    if(/\b(initiatives?|prototypes?|poches? d.?[eé]nergie|pockets? of energy|projets?)\b/.test(txt) && !/\b(inscrire|register)\b/.test(txt)){ return {actions:[],reply:{text:t('c.ini.go'),blocks:[{type:'inis',ids:visibleIni().slice(0,4).map(i=>i.id)},{type:'chips',items:[chip(t('c.i.initiative'),null,null,'initiative'),chip(t('view.pan'),null,[{type:'setView',view:'panorama'}])]}]},path:null,handled:true}; }
    if(/\b(inscrire|inscription|mon organisation|my organisation|register|add my|ajouter mon)\b/.test(txt)){ actions.push({type:'startRegistration'}); return {actions,reply:{text:t('c.register.go'),blocks:[]},path:null,handled:true}; }
    const g=matchGroups(txt); if(/jonction|junction/.test(txt) && g.length>=2){ actions.push({type:'openJunction',a:g[0],b:g[1]}); return {actions,reply:{text:t('c.junction.go',{a:t('ag.'+g[0]),b:t('ag.'+g[1])}),blocks:[]},path,handled:true}; }
    if(only) actions.push({type:'clearFilters'});
    for(const dim of ['region','theme','lever','participants','archetype']){ const vals=matchVocab(txt,dim); vals.forEach(v=>{ actions.push({type:removing?'removeFilter':'addFilter',dim,value:v}); handled=true; }); if(dim==='region' && !removing && vals.length && /\b(zoom|carte|map|ou|where|pres de|near)\b/.test(txt)) actions.push({type:'zoomRegion',region:vals[0]}); }
    const rt=matchVocab(txt,'rtype'); if(rt.length){ actions.push({type:'rtype',value:rt[0]}); handled=true; }
    const o=matchOrg(txt); if(o && (/\b(ouvre|montre|open|show|qui est|what is|fiche|selectionne|select)\b/.test(txt) || txt.split(' ').length<=6)){ actions.push({type:'selectOrg',org:o}); return {actions,reply:{text:t('c.org.open',{name:o.name}),blocks:[{type:'orgs',ids:[o.id]}]},path,handled:true}; }
    const r=!o?matchRes(txt):null; if(r){ actions.push({type:'selectResource',res:r}); return {actions,reply:{text:t('c.res.open',{title:r.title}),blocks:[]},path,handled:true}; }
    if(/\b(combien|how many|count)\b/.test(txt)) handled=true;
    // path triggers by keyword
    if(!path){ if(/\b(decouvrir|discover|explore|qui agit|who is|who acts)\b/.test(txt)) path={name:'discover',step:0}; else if(/\b(partenaire|partner|projet|project|collabor)\b/.test(txt)) path={name:'partners',step:0}; else if(/\b(savoir|standard|outil|ressource|resource|tool|knowledge)\b/.test(txt)&&!handled) path={name:'knowledge',step:0}; if(path) handled=true; }
  }
  return {actions,reply:null,path,handled,txt};
}

function pathTurn(path,ctx){
  const vis=visibleNow();
  if(!path) return null;
  const P={
    discover:[
      ()=>({text:t('c.d.where'),blocks:[{type:'chips',items:regionChips()}],next:1}),
      ()=>({text:describeChange()+' '+t('c.d.kind'),blocks:[numbersStrip(),{type:'chips',items:familyChips()}],next:2}),
      ()=>({text:describeChange()+' '+t('c.d.share'),blocks:[numbersStrip(),{type:'orgs',ids:topOrgs(4)},{type:'chips',items:[chip(t('c.yes.share'),null,[{type:'setView',view:'knowledge'}],'further'),chip(t('c.d.more'),null,[{type:'setView',view:'clusters'}],'further')]}],next:3}),
    ],
    knowledge:[
      ()=>({text:t('c.k.topic'),blocks:[{type:'chips',items:themeChips()}],next:1}),
      ()=>({text:describeChange()+' '+t('c.k.form'),blocks:[numbersStrip(),{type:'chips',items:rtypeChips()}],next:2}),

    ],
    partners:[
      ()=>({text:t('c.p.project'),blocks:[],next:1,free:true}),
      ()=>({text:(ctx.detected?.length?t('c.p.detected',{list:ctx.detected.map(label).join(', ')}):t('c.p.nodetect'))+' '+t('c.p.role'),blocks:[{type:'chips',items:roleChips()}],next:2}),
      ()=>({text:t('c.p.region'),blocks:[{type:'chips',items:[...regionChips(),chip(t('c.anywhere'),null,[])]}],next:3}),
      ()=>{ const T=new Set(active.theme); const cands=vis.map(o=>({o,s:bridgingScore(o,vis)+2*vals(o,'themes').filter(x=>T.has(x)).length})).sort((a,b)=>b.s-a.s).slice(0,6); const gs=[...active.participants].map(p=>P2G[p]).filter(Boolean); const my=myOrg?[...actorGroups(myOrg)]:(profile?.role&&P2G[profile.role]?[P2G[profile.role]]:[]); let jx=null; if(gs[0]&&my[0]&&gs[0]!==my[0]){ const st=panStats(panVisibleOrgs(),panVisibleRes()); if(st.M[st.idx.get(gs[0])][st.idx.get(my[0])]<=st.thr) jx={a:my[0],b:gs[0]}; } return {text:t('c.p.result',{n:cands.length})+' '+describeChange(),blocks:[{type:'orgs',ids:cands.map(x=>x.o.id),connect:true},...(jx?[{type:'junction',a:jx.a,b:jx.b}]:[]),{type:'chips',items:furtherChips()}],next:4}; },
    ],
    initiative:[
      ()=>({text:t('c.ini.where'),blocks:[{type:'chips',items:[...ACTOR_GROUPS.map(g=>chip(t('ag.'+g),null,[{type:'iniGroup',g}])),chip(t('c.anywhere'),null,[{type:'iniGroup',g:null}])]}],next:1}),
      ()=>({text:t('c.ini.theme'),blocks:[{type:'chips',items:[...VOCAB.themes.slice(0,7).map(th=>chip(label(th),null,[{type:'addFilter',dim:'theme',value:th}])),chip(t('c.anywhere'),null,[])]}],next:2}),

    ],
    further:[()=>({text:describeChange()+' '+t('c.further'),blocks:[numbersStrip(),{type:'chips',items:furtherChips()}],next:1})],
    junctions:[()=>{ const st=panStats(panVisibleOrgs(),panVisibleRes()); return {text:t('c.junctions'),blocks:st.thin.slice(0,3).map(([a,b])=>({type:'junction',a,b})),next:1}; }],
    near:[()=>{ const r=profile?.region||myOrg?.region; if(r){ ACT.addFilter('region',r); applyState(); ACT.zoomRegion(r); } return {text:(r?t('c.near.yes',{region:label(r)}):t('c.near.no'))+' '+describeChange(),blocks:[numbersStrip(),{type:'orgs',ids:topOrgs(4)},{type:'chips',items:furtherChips()}],next:1}; }],

    restart:[()=>({text:t('c.restart'),blocks:[{type:'chips',items:intentChips()}],next:1})],

async function handleUser(text,presetActions,presetPath){
  if(comp.busy) return; comp.busy=true;
  comp.turns.push({role:'u',text,ts:Date.now()}); renderDetail();
  // a beat of typing before the answer, so the thread reads as a conversation (and the indicator is visible)
  const t0=performance.now(); await new Promise(r=>setTimeout(r,350));
  const before=viewMode;
  let out=rulesInterpret(text,presetActions); let engine='rules';
  if(presetPath){ out.path={name:presetPath,step:0}; out.handled=true; if(pathTurn(out.path,{})) out.reply=null; /* a scripted path wins over a rules reply */ }
  // free text inside the partners path: detect themes/levers from the project sentence
  const ctx={};
  if(comp.path?.name==='partners' && comp.path.step===1 && !presetActions){ ctx.detected=[...matchVocab(norm(text),'theme'),...matchVocab(norm(text),'lever')]; ctx.detected.forEach(v=>out.actions.push({type:'addFilter',dim:VOCAB.themes.includes(v)?'theme':'lever',value:v})); out.handled=true; out.path=comp.path; }
  const rtypeAct=out.actions.find(a=>a.type==='rtype'); if(rtypeAct) ctx.rtype=rtypeAct.value;
  // AI engine for free text we do not understand well (or always, when available) — falls back to rules
  let aiReply=null;
  if(!presetActions && !presetPath && window.claude?.use){ try{ aiReply=await aiInterpret(text); if(aiReply){ engine='ai'; } }catch(e){ aiReply=null; } }
  if(!aiReply){ const moved=runActions(out.actions.filter(a=>a.type!=='rtype')); if(moved||viewMode!==before) petalPulse(); }
  let reply;
  if(aiReply){ reply={text:aiReply.text,blocks:[numbersStrip(),...(aiReply.chips?.length?[{type:'chips',items:aiReply.chips.map(c=>chip(c,c))}]:[])]}; }
  else if(out.reply){ reply=out.reply; comp.path=out.path; }
  else {
    const path=out.path||comp.path;
    if(path && (out.handled||presetPath)){ const turn=pathTurn(path,ctx); if(turn){ reply={text:turn.text,blocks:turn.blocks}; if(turn.view) ACT.setView(turn.view); comp.path=turn.done?null:{name:path.name,step:turn.next}; } }
    else if(path && !out.handled){ const turn=pathTurn(path,ctx); if(turn) reply={text:t('c.unknown.short')+' '+turn.text,blocks:turn.blocks}; }
    if(!reply){ if(out.handled){ reply={text:describeChange(),blocks:[numbersStrip(),{type:'orgs',ids:topOrgs(3)},{type:'chips',items:[...(active.theme.size?[chip(t('c.yes.share'),null,[{type:'setView',view:'knowledge'}],'further')]:[]),...furtherChips().slice(0,3)]}]}; } else { reply={text:t('c.unknown'),blocks:[{type:'chips',items:intentChips()},{type:'actions',items:[chip(t('c.ex1'),t('c.ex1')),chip(t('c.ex2'),t('c.ex2')),chip(t('c.ex3'),t('c.ex3'))]}]}; } }
  }
  // zero results: say so and offer to drop each filter
  if(!aiReply && visibleNow().length===0 && Object.values(active).some(x=>x.size)){ const drops=[]; for(const d in active) active[d].forEach(v=>drops.push(chip(t('c.without',{v:label(v)}),null,[{type:'removeFilter',dim:d,value:v}]))); reply={text:t('c.zero')+' '+reply.text,blocks:[{type:'chips',items:[...drops.slice(0,4),chip(t('c.f.restart'),null,[{type:'clearFilters'}],'restart')]}]}; }
  { const rest=350-(performance.now()-t0); if(rest>0) await new Promise(r=>setTimeout(r,rest)); }
  comp.turns.push({role:'a',text:reply.text,blocks:reply.blocks||[],eng:engine,ts:Date.now()});
  comp.busy=false; compSave(); renderDetail();
}
// ---- AI engine (Claude viewer only): tools wired to the canvas ----

  const tool=(name,description,properties,required,fn)=>({name,description,inputSchema:{type:'object',properties,required},execute:async(input)=>{ const r=fn(input)||'ok'; applyState(); return r; }});
  const tools=[

    tool('remove_filter','Remove one filter value.',{dimension:{type:'string'},value:{type:'string'}},['dimension','value'],i=>{ ACT.removeFilter(String(i.dimension),String(i.value)); return {visible:visibleNow().length}; }),
    tool('clear_filters','Remove all filters and the search.',{},[],()=>{ ACT.clearFilters(); return {visible:visibleNow().length}; }),
    tool('set_query','Full-text search over organisations, resources and events (names, acronyms, cities, themes, descriptions; tolerant to accents and typos).',{q:{type:'string'}},['q'],i=>{ ACT.setQuery(String(i.q)); return {visible:visibleNow().length,resources:resHits.length}; }),
    tool('set_view','Switch the visualisation: clusters|map|knowledge|panorama.',{view:{type:'string'}},['view'],i=>{ ACT.setView(String(i.view)); return 'ok'; }),
    tool('zoom_region','Zoom the world map on a region (exact region name).',{region:{type:'string'}},['region'],i=>{ ACT.zoomRegion(String(i.region)); return 'ok'; }),
    tool('select_org','Open an organisation by name (fuzzy).',{name:{type:'string'}},['name'],i=>{ const o=matchOrg(norm(String(i.name))); if(!o) throw new Error('not found'); ACT.selectOrg(o); return {opened:o.name}; }),
    tool('open_junction','Open the junction card between two actor groups: '+ACTOR_GROUPS.join(', '),{a:{type:'string'},b:{type:'string'}},['a','b'],i=>{ ACT.openJunction(String(i.a),String(i.b)); return 'ok'; }),
    tool('start_registration','Start the guided registration of the user organisation.',{},[],()=>{ ACT.startRegistration(); return 'ok'; }),
    tool('explain_symbols','Explain the signs used on the map (dot, ◆ gathering, ✦ initiative host, cluster bubble, group circle) and open the legend panel.',{},[],()=>{ setLegend(true); return {signs:t('c.symbols')}; }),
    tool('list_initiatives','List the initiatives (including the prototypes supported by HE4G), optionally filtered by actor group ('+ACTOR_GROUPS.join('|')+'), theme or stage (idea|prototype|evidence|scaling). Returns id, title, stage, junction, hosts.',{group:{type:'string'},theme:{type:'string'},stage:{type:'string'}},[],i=>INI.filter(x=>(!i.group||x.jx.includes(String(i.group)))&&(!i.theme||x.themeKeys.some(th=>norm(th).includes(norm(String(i.theme)))))&&(!i.stage||x.stage===i.stage)).map(x=>({id:x.id,title:iniTitle(x),stage:x.stage,junction:x.jx,hosts:x.hosts,kind:x.kind}))),
    tool('open_initiative','Open the panel of one initiative by id (from list_initiatives).',{id:{type:'string'}},['id'],i=>{ const x=iniById.get(String(i.id)); if(!x) throw new Error('not found'); selectIni(x); return {opened:iniTitle(x)}; }),
  ];
  const prompt=`You are Bloom, the friendly assistant of an interactive map of ${state.total} organisations transforming business education. Reply in the user's language (${lang==='fr'?'French':'English'}), in at most two short sentences, say what you changed on the map, then on the last line output JSON {"chips":[up to 4 short next-step suggestions]}.
Use tools to act on the map. Exact vocabularies — regions: ${JSON.stringify(REGIONS)}; themes: ${JSON.stringify(VOCAB.themes)}; levers: ${JSON.stringify(VOCAB.levers)}; participants: ${JSON.stringify(VOCAB.participants)}; archetypes: ${JSON.stringify(VOCAB.archetypes)}.
Current state: ${JSON.stringify(state)}.
User: ${JSON.stringify(text)}`;
  const {text:ans}=await sample(prompt,{tools,modelTier:'quick'});
  let chips=[]; let body=ans||''; const m=body.match(/\{[^{}]*"chips"[^{}]*\}\s*$/); if(m){ try{ chips=(JSON.parse(m[0]).chips||[]).filter(x=>typeof x==='string').slice(0,4); }catch(e){} body=body.slice(0,m.index); }
  return {text:body.trim()||describeChange(),chips};
}
